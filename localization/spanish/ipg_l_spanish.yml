  ipg_formula_2_desc:0 "Método de promedios mayores (divisores 1, 2, 3, 4…). Favorece levemente a partidos grandes. Tamaño: #v -5 %#!."
  ipg_formula_2_cond:0 "Países no-$language_anglophone$ bajo #v $law_landed_voting$#!, #v $law_wealth_voting$#! o #v $law_census_voting$#!."
  ipg_formula_3_desc:0 "Divisores impares (1, 3, 5, 7…). Estándar nórdico equilibrado. Tamaño de la cámara: #v +10 %#! (escaños de nivelación)."
  ipg_formula_3_cond:0 "#v $law_universal_suffrage$#! con #v $law_parliamentary_republic$#! o #v $law_council_republic$#!."
  ipg_formula_4_desc:0 "Representación proporcional con barrera del #v 5 %#!. Facciones por debajo no obtienen escaño. Tamaño: #v -15 %#!."
