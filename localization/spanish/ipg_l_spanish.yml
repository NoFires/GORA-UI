l_spanish:

  # ==== Panel chrome ====
  ipg_panel_title:0 "Parlamento"
  ipg_expand:0 "Expandir"
  ipg_collapse:0 "Contraer"
  ipg_view_power:0 "Estructura de poder"
  ipg_view_alignment:0 "Alineación política"
  ipg_view_electoral:0 "Estructura de partidos"
  ipg_power_desc:0 "Fuerza política de todos los grupos de interés."
  ipg_alignment_desc:0 "Alineación de la población por grupo de interés."
  ipg_electoral_desc:0 "Basado en los resultados de las últimas elecciones."
  ipg_other_aligned:0 "Otros alineados"
  ipg_unaligned:0 "No alineados políticamente"
  ipg_other_minor:0 "Otros partidos/grupos"
  ipg_independent:0 "Independiente"
  ipg_last_election:0 "Últimas elecciones"
  ipg_seats_unit:0 "Escaños"

  # ==== Power Structure tooltip (clout share) ====

  # ==== Political Alignment tooltip (population share) ====
  ipg_alignment_unaligned_desc:0 "$ipg_unaligned$: #variable [GetPlayer.MakeScope.Var('ipg_alignment_unaligned_share').GetValue|1]%#!"

  # ==== Party Structure tooltip ====
  ipg_power_list_item:0 "[InterestGroup.GetName]: #variable [InterestGroup.MakeScope.Var('power_seats').GetValue|v0]#! $ipg_seats_unit$ ([InterestGroup.MakeScope.Var('power_share').GetValue|1]%)"
  ipg_alignment_list_item:0 "[InterestGroup.GetName]: #variable [InterestGroup.MakeScope.Var('alignment_share').GetValue|1]%#!"
  ipg_electoral_list_item:0 "[Party.GetName]: #variable [Party.MakeScope.Var('electoral_seats').GetValue|v0]#! $ipg_seats_unit$ ($ipg_last_election$: [Party.MakeScope.Var('ipg_last_election_vote_share').GetValue|%1])"
