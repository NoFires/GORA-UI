  ipg_formula_auto_cond:0 "• #v Sin ley electoral#!: Hare / Hamilton\n• #v $heritage_british$ / $language_anglophone$#! (con voto): Mayoritario (FPTP)\n• #v $law_universal_suffrage$#! (#v $law_parliamentary_republic$ / $law_council_republic$#!): Sainte-Laguë\n• #v $law_universal_suffrage$#! (otros): Umbral del 5 %\n• #v $law_landed_voting$ / $law_wealth_voting$ / $law_census_voting$#! (otros): D'Hondt"
  ipg_formula_1_desc:0 "Método del resto mayor (cuota de Hare), estrictamente proporcional. Tamaño de la cámara: #v estándar (100 %)#!."
