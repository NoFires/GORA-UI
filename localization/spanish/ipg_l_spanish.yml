  ipg_formula_reason_2:0 "Adopta el método continental #v D'Hondt#! bajo #v $law_landed_voting$#! / #v $law_wealth_voting$#! / #v $law_census_voting$#!."
  ipg_formula_reason_3:0 "Adopta el método equilibrado #v Sainte-Laguë#! bajo #v $law_universal_suffrage$#! en #v $law_parliamentary_republic$#! o #v $law_council_republic$#!."
