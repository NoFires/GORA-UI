 SMART_TRADE_TREATIES_TT:0 "#header Ingreso neto de tratados#!\nBienes que envías: @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), GetPlayer.MakeScope.ScriptValue('st_player_treaty_money'))|D+=]\nCoste de rutas marítimas: @money![Negate_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=] (estimación)\nTransferencias de dinero: @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_money')|D+=]\nEl transporte se paga en marina mercante al precio de tu mercado; más puertos lo abaratan.\nDetalles en la lista de tratados del esquematizador."
