 ST_REC_ONE_HEADER:0 "(ST) Mejores socios para este bien"
 ST_REC_ONE_HEADER_TT:0 "Los 3 países más rentables a los que enviar este bien con una transferencia de bienes, calculados al abrir este panel: beneficio semanal con los precios de la primera semana, a la mejor cantidad que el socio acepta por completo. Entre paréntesis: la aceptación base del socio antes de cualquier artículo (pasa el cursor para el detalle); se omiten los socios por debajo de 0."
