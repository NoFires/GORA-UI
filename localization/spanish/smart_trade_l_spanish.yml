 ST_REC_HEADER:0 "(ST) Transferencias de bienes sugeridas"
 ST_REC_HEADER_TT:0 "Las 5 transferencias de bienes más rentables que podrías proponer ahora, recalculadas cada mes: beneficio semanal estimado con los precios de la primera semana, a la mejor cantidad que el socio acepta por completo.\nSolo transferencias rentables, bienes de los que tu mercado tiene al menos 10 de sobra y socios con los que no estás en guerra.\nEntre paréntesis: la aceptación base del socio antes de cualquier artículo (pasa el cursor para el detalle). Los socios por debajo de 0 se omiten una vez conocida su cifra, desde su primer mes."
 ST_REC_REFRESH_TT:0 "Recalcular las sugerencias ahora."
 ST_REC_NONE:0 "Ahora mismo ninguna transferencia de bienes sería rentable."
 ST_REC_PENDING:0 "Se calcula al cambiar de mes. Pulsa el botón de actualizar para calcularlo ahora."
 ST_REC_TREATY_TT:0 "Abrir un tratado con este país."
