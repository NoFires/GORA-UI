 TRADE_PARTNERS_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nImportado de [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Cuota de [Concept('concept_trade','$concept_imports|q$')] de este mercado: #blue_value [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (de #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!)\n• Cuota en exportaciones de [Goods.GetNameNoFormatting] del socio: #v [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketExports, '(CFixedPoint)1'))|%1]#! (de #v [Goods.GetMarketExports|D]#!)"
 TRADE_PARTNERS_GOODS_EXPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nExportado a [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Cuota de [Concept('concept_trade','$concept_exports|q$')] a este mercado: #gold_value [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (de #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!)\n• Cuota en importaciones de [Goods.GetNameNoFormatting] del socio: #v [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (de #v [Goods.GetMarketImports|D]#!)"
 TRADE_PARTNERS_OTHER_EXPORT_SHARE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] ▶ [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\nLas [Concept('concept_trade','$concept_exports|q$')] a [Market.GetName] suponen el #gold_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), Max_CFixedPoint(GetPlayer.GetMarket.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! del total de [GetPlayer.GetMarket.GetName]\n$TOOLTIP_DELIMITER$\n• Hacia este mercado: #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!\n• Total de [Concept('concept_trade','$concept_exports|q$')] del mercado: #v [GetPlayer.GetMarket.GetTotalExportedAmount|D]#!"
