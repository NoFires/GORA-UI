 TRADE_PARTNERS_OTHER_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nExportado a [Market.GetName]: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Cuota de [Concept('concept_trade','$concept_exports|q$')] a este mercado: #gold_value [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), '(CFixedPoint)1'))|%1]#! (de #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!)\n• Cuota en importaciones de [Goods.GetNameNoFormatting] del socio: #v [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (de #v [Goods.GetMarketImports|D]#!)"
