l_spanish:
 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! Importa [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0] bienes desde [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! Exporta [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0] bienes hacia [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName] exporta al [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Cantidad: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [Market.GetName] importa desde [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Cantidad: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Market.GetName] importa desde [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Cantidad: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName] exporta al [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Cantidad: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "Bienes Exportados:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "Bienes Importados:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "Socios de Exportaciones"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "Socios de Importaciones"
 TRADE_PARTNERS_TRADE_SURPLUS: "Superávit comercial"
 TRADE_PARTNERS_TRADE_DEFICIT: "Déficit comercial"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]s que importan bienes desde [Market.GetName] mediante el [concept_world_market], ordenados por cuota de [Concept('concept_trade','$concept_exports|q$')].\nLos valores bilaterales se calculan al [concept_world_market_price] actual."
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]s que exportan bienes a [Market.GetName] mediante el [concept_world_market], ordenados por cuota de [Concept('concept_trade','$concept_imports|q$')].\nLos valores bilaterales se calculan al [concept_world_market_price] actual."
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "Valorado al [concept_world_market_price] actual"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nLas [Concept('concept_trade','$concept_imports|q$')] de [Scope.GetMarket.GetName] suponen el #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! del total de [Market.GetName]\n$TOOLTIP_DELIMITER$\n• Desde este mercado: #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• Total de [Concept('concept_trade','$concept_imports|q$')] del mercado: #v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nLas [Concept('concept_trade','$concept_exports|q$')] a [Scope.GetMarket.GetName] suponen el #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! del total de [Market.GetName]\n$TOOLTIP_DELIMITER$\n• Hacia este mercado: #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• Total de [Concept('concept_trade','$concept_exports|q$')] del mercado: #v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nComercio bilateral total: @money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] al socio: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] del socio: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nCon [Scope.GetMarket.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! Valor de [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! Valor de [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Valorado al [concept_world_market_price] actual#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nValor bilateral: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Volumen comerciado: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nValor bilateral: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Volumen comerciado: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nCon [Market.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! Valor de [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! Valor de [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Valorado al [concept_world_market_price] actual#!"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nValor bilateral: @money!#v [Multiply_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Volumen comerciado: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nValor bilateral: @money!#v [Multiply_CFixedPoint(Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Volumen comerciado: #v [Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_HEADER_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]"
 TRADE_PARTNERS_HEADER_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]"
 TRADE_PARTNERS_KPI_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]:"
