l_simp_chinese:
 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! 从 [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName] 进口了总计 [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0] 的商品"
 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! 向 [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName] 出口了总计 [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0] 的商品"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName] 出口至 [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!数量: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [Market.GetName] 从 [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName] 进口\n#!#!数量: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Market.GetName] 从 [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName] 进口\n#!#!数量: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName] 出口至 [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!数量: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "出口商品："
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "进口商品："
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "出口伙伴"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "进口伙伴"
 TRADE_PARTNERS_TRADE_SURPLUS: "贸易顺差"
 TRADE_PARTNERS_TRADE_DEFICIT: "贸易逆差"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "展示在[concept_world_market]上从[Market.GetName][Concept('concept_trade','$concept_imports|q$')]商品的各个[concept_market]，按[Concept('concept_trade','$concept_exports|q$')]量占比排序。\n双边贸易额均按当前[concept_world_market_price]折算。"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "展示在[concept_world_market]上向[Market.GetName][Concept('concept_trade','$concept_exports|q$')]商品的各个[concept_market]，按[Concept('concept_trade','$concept_imports|q$')]量占比排序。\n双边贸易额均按当前[concept_world_market_price]折算。"
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "各项商品均按当前[concept_world_market_price]折算"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n来自[Scope.GetMarket.GetName]的[Concept('concept_trade','$concept_imports|q$')]占[Market.GetName]总[Concept('concept_trade','$concept_imports|q$')]量的 #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#!\n$TOOLTIP_DELIMITER$\n• 来自该市场：#v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• 市场总[Concept('concept_trade','$concept_imports|q$')]：#v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n流向[Scope.GetMarket.GetName]的[Concept('concept_trade','$concept_exports|q$')]占[Market.GetName]总[Concept('concept_trade','$concept_exports|q$')]量的 #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#!\n$TOOLTIP_DELIMITER$\n• 流向该市场：#v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• 市场总[Concept('concept_trade','$concept_exports|q$')]：#v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n双边贸易总额：@money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! 向对方[Concept('concept_trade','$concept_exports|q$')]：@money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!（#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!）\n@market_imports! 从对方[Concept('concept_trade','$concept_imports|q$')]：@money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!（#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!）"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n对[Scope.GetMarket.GetName]：@money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]额：@money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]额：@money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore 按当前[concept_world_market_price]折算#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n双边贸易额：@money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 贸易量：#v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n双边贸易额：@money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 贸易量：#v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n对[Market.GetName]：@money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]额：@money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]额：@money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore 按当前[concept_world_market_price]折算#!"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n双边贸易额：@money!#v [Multiply_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 贸易量：#v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n双边贸易额：@money!#v [Multiply_CFixedPoint(Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 贸易量：#v [Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_HEADER_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]"
 TRADE_PARTNERS_HEADER_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]"
 TRADE_PARTNERS_KPI_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]:"
 TRADE_PARTNERS_KPI_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]:"
 TRADE_PARTNERS_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\n自[Scope.GetMarket.GetName][Concept('concept_trade','$concept_imports|q$')]：#v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• 占从该市场总[Concept('concept_trade','$concept_imports|q$')]：#blue_value [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#!（共#v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!）\n• 占该市场[Goods.GetNameNoFormatting]总[Concept('concept_trade','$concept_exports|q$')]：#v [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketExports, '(CFixedPoint)1'))|%1]#!（共#v [Goods.GetMarketExports|D]#!）"
