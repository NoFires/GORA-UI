 rule_trade_partners_chart_display: "贸易伙伴图表显示"
 rule_trade_partners_chart_display_desc: "设置在市场界面中是否计算并显示贸易伙伴分布图表。"
 setting_trade_partner_show_all: "显示全部"
 setting_trade_partner_show_all_desc: "为包含有效贸易的所有市场（AI和玩家）计算并显示贸易伙伴图表。"
 setting_trade_partner_players_only: "仅玩家显示"
 setting_trade_partner_players_only_desc: "仅为玩家拥有的市场计算并显示贸易伙伴图表，有助于在单人或多人游戏中提升游戏运行性能。"
