 TRADE_PARTNERS_OTHER_EXPORT_SHARE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] ▶ [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\n流向[Market.GetName]的[Concept('concept_trade','$concept_exports|q$')]占[GetPlayer.GetMarket.GetName]总[Concept('concept_trade','$concept_exports|q$')]量的 #gold_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), Max_CFixedPoint(GetPlayer.GetMarket.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#!\n$TOOLTIP_DELIMITER$\n• 流向该市场：#v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!\n• 市场总[Concept('concept_trade','$concept_exports|q$')]：#v [GetPlayer.GetMarket.GetTotalExportedAmount|D]#!"
