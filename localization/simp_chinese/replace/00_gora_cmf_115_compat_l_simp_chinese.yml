 com_interorg_leader_title: "[Concept('concept_com_international_organization_chair', Concatenate3('$concept_com_international_organization_short|q$',' ',Select_CString(ComJournalVar('com_interorg_chair_title_var').IsSet,ComJournalVar('com_interorg_chair_title_var').GetFlagName,'$com_interorg_title_chair|q$')))]"
 com_situation_involved_countries: "$com_involved$[Concept('concept_country', '$concept_countries|q$')]"
 com_situation_interloper_countries: "$com_interloper$[Concept('concept_country', '$concept_countries|q$')]"
 concept_com_international_situation_desc: "$concept_com_international_situations$是复杂且长期的事件，需要大小[Concept('concept_country','$concept_countries|q$')]各方持续关注。这些事件既能带来战略机遇，也可能恶化为地缘政治危机。\n\n$concept_com_international_situations$通常涉及两个或更多[Concept('concept_com_situation_faction','$concept_com_situation_factions|q$')]，每一方都有各自的[concept_com_situation_leader]。一旦解决，它们将从你的$concept_journal$中移除。"
 com_international_situations: "[Concept('concept_com_international_situation','$concept_com_international_situations|q$')]"
 com_situation: "[Concept('concept_com_international_situation','$concept_com_international_situation_short|q$')]"
 com_situations: "[Concept('concept_com_international_situation','$concept_com_international_situations_short|q$')]"
 com_involvement: "[Concept('concept_com_situation_involvement','$com_situation_involvement|q$')]"
 com_involved: "[Concept('concept_com_situation_involvement','$concept_com_situation_involved|q$')]"
 com_uninvolved: "[Concept('concept_com_situation_involvement','$concept_com_situation_uninvolved|q$')]"
 com_situation_interlopers: "[Concept('concept_com_situation_interloper','$concept_com_situation_interlopers|q$')]"
 com_interloper: "[Concept('concept_com_situation_interloper','$concept_com_situation_interloper_short|q$')]"
 com_interlopers: "[Concept('concept_com_situation_interloper','$concept_com_situation_interlopers_short|q$')]"
 concept_com_situation_leader_desc: "[Concept('concept_com_situation_faction','$concept_com_faction|q$')]各方的一个[concept_country]被视为该$concept_com_faction$的$concept_com_situation_leader$。这些国家通常（但并非总是）是$com_situation$的煽动者，并且往往是推动$concept_com_situation$走向最终解决的进展驱动者。"
 concept_com_situation_faction_desc: "$concept_com_situation_factions$是对$com_situation$的结果有共同利益的[Concept('concept_country','$concept_countries|q$')]。它们在各自的[Concept('concept_com_situation_leader','$concept_com_situation_leaders|q$')]（直接或间接）指导下运作，并可能从其最终解决中受益或受损。"
 concept_com_situation_faction_neutral_desc: "$concept_com_situation_factions_neutral$可以是一个拥有第三目标的明确集团，也可以是对卷入或受$com_situation$影响的国家的单纯描述性称呼。$concept_com_factions_neutral$是松散参与形势的[Concept('concept_country','$concept_countries|q$')]，但在适当的条件下，它们可能会被说服加入某一方。"
 effect_clear_com_situation_factions: "[TopScope.GetLocalVariable('com_side_name').GetFlagName|v]上的所有[Concept('concept_com_situation_faction', '$concept_com_situation_factions|q$')]将解散"
 effect_clear_com_situation_factions_all: "双方的所有[Concept('concept_com_situation_faction', '$concept_com_situation_factions|q$')]都将解散"
 trigger_has_any_com_situation_factions_not: "$com_situation$没有任何[Concept('concept_com_situation_faction', '$concept_com_situation_factions|q$')]"
