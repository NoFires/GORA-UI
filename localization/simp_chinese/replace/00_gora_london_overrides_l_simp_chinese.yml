l_simp_chinese:
 # GORA UI+ — Conference of London journal-entry overhaul
 # Adds GP flag icons + per-proposal vote breakdowns to the vanilla journal
 # entry. Verified against vanilla 1.13.4 key `je_conference_of_london_reason`.

 je_conference_of_london_reason: "列强已派代表团前往伦敦，旨在解决荷兰与比利时之间悬而未决的边界问题。\n\n共有 #variable [GetGlobalVariable( 'je_conference_of_london_participants_var' ).GetValue]#! 个 [Concept('concept_great_power', '$concept_great_powers$')] 参加了此次会议。\n#bold #tooltippable #tooltip:favour_belgium_button_desc $favour_belgium_button$#!#!#! 获得了总计 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_1' ).GetValue]#! [concept_prestige] 的支持：[ROOT.GetCountry.GetCustom('tlcm_gbr_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_fra_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_rus_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_aus_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_pru_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_spa_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_usa_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_tur_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_jap_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_ita_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_other_favours_belgium')]\n#bold #tooltippable #tooltip:favour_netherlands_button_desc $favour_netherlands_button$#!#!#! 获得了总计 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_2' ).GetValue]#! [concept_prestige] 的支持：[ROOT.GetCountry.GetCustom('tlcm_gbr_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_fra_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_rus_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_aus_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_pru_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_spa_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_usa_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_tur_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_jap_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_ita_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_other_favours_netherlands')]\n#bold #tooltippable #tooltip:partition_compromise_button_desc $partition_compromise_button$#!#!#! 获得了总计 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_3' ).GetValue]#! [concept_prestige] 的支持：[ROOT.GetCountry.GetCustom('tlcm_gbr_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_fra_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_rus_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_aus_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_pru_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_spa_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_usa_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_tur_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_jap_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_ita_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_other_partition_compromise')]\n#bold #tooltippable #tooltip:luxembourg_compromise_button_desc $luxembourg_compromise_button$#!#!#! 获得了总计 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_4' ).GetValue]#! [concept_prestige] 的支持：[ROOT.GetCountry.GetCustom('tlcm_gbr_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_fra_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_rus_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_aus_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_pru_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_spa_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_usa_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_tur_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_jap_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_ita_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_other_luxembourg_compromise')]\n\n会议将在 #variable [GetGlobalVariable('je_conference_of_london_timer').GetValue]#! 个月后结束。届时拥有最高威望 #tooltippable #tooltip:london_treaty_voting_rules 支持#!#! 的提议将被选为会议的正式解决方案。\n\n#Bold 结果#!\n会议已 [ROOT.GetCountry.GetCustom('treaty_of_london_coutcome')][ROOT.GetCountry.GetCustom('treaty_of_london_acceptance_timer')]"

 # Per-power flag-icon line fragments referenced by the customizable_localization
 # `tlcm_*_favours_*` entries (defined in customizable_localization/tlcm_custom_loc.txt).
 # Each line resolves both the flag icon AND the display name dynamically
 # from the saved global ref. Using GetNameNoFormatting (vs. the static
 # `$TAG$` locale key) means formed countries (DEU after unification, ITA
 # after Sardinia formation) show their current name correctly, and no
 # missing-locale-key warnings ever fire.
 tlcm_gbr_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_gbr').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_gbr').GetCountry.GetNameNoFormatting]#!"
 tlcm_fra_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_fra').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_fra').GetCountry.GetNameNoFormatting]#!"
 tlcm_rus_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_rus').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_rus').GetCountry.GetNameNoFormatting]#!"
 tlcm_aus_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_aus').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_aus').GetCountry.GetNameNoFormatting]#!"
 tlcm_pru_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_pru').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_pru').GetCountry.GetNameNoFormatting]#!"
 tlcm_spa_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_spa').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_spa').GetCountry.GetNameNoFormatting]#!"
 tlcm_usa_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_usa').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_usa').GetCountry.GetNameNoFormatting]#!"
 tlcm_tur_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_tur').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_tur').GetCountry.GetNameNoFormatting]#!"
 tlcm_jap_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_jap').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_jap').GetCountry.GetNameNoFormatting]#!"
 tlcm_ita_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_ita').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_ita').GetCountry.GetNameNoFormatting]#!"
 # DEU (Germany) intentionally omitted — see common/scripted_effects/gora_london_effects.txt comment.
 tlcm_other_favour_loc: "\n其他列强"
 tlcm_no_loc: ""
