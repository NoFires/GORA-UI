  ipg_formula_opt_badge_pr:0 "比例代表制"
  ipg_formula_opt_badge_maj:0 "多数代表制"
  ipg_formula_reason_manual:0 "当前采用自定义议席分配制度，统一适用于「政党结构」「权力结构」与「政治倾向」的席位与占比。"
  ipg_formula_reason_1:0 "尚未实行投票法律，采用 #v 哈密顿法#! 按$concept_clout$比例分配席位。"
  ipg_formula_reason_2:0 "实行 #v $law_landed_voting$#! / #v $law_wealth_voting$#! / #v $law_census_voting$#!，采用欧陆主流 #v 洪特法#!（温和偏向大党与稳固联盟）。"
  ipg_formula_reason_3:0 "在 #v $law_parliamentary_republic$#! 或 #v $law_council_republic$#! 下实行 #v $law_universal_suffrage$#!，采用均衡的 #v 圣拉格法#!。"
  ipg_formula_reason_4:0 "实行 #v $law_universal_suffrage$#!，采用 #v 5% 门槛制#! 以抑制议会过度碎片化。"
  ipg_formula_reason_5:0 "承袭 #v $heritage_british$ / $language_anglophone$#! 单一选区传统且拥有投票法律，采用 #v 多数制加成#!。"
  ipg_formula_auto_desc:0 "依本国$lawgroup_distribution_of_power$法律与宪政传统自动确立相称的议席分配制度。"
  ipg_formula_auto_cond:0 "• #v 无投票法律#!：哈密顿法\n• #v $heritage_british$ / $language_anglophone$#!（含投票法）：多数制加成\n• #v $law_universal_suffrage$#!（#v $law_parliamentary_republic$ / $law_council_republic$#!）：圣拉格法\n• #v $law_universal_suffrage$#!（其余政体）：5% 门槛制\n• #v $law_landed_voting$ / $law_wealth_voting$ / $law_census_voting$#!（其余）：洪特法"
  ipg_formula_1_desc:0 "经典最大余数法（黑尔基数）。严格按比例分配整数席，剩余席位依小数余数由大到小分配，大中小党最均衡。\n议会规模：#v 标准（100%）#!。"
  ipg_formula_1_cond:0 "适用于未实行投票法律的政体（#v $law_autocracy$#!、#v $law_oligarchy$#!、#v $law_technocracy$#!、#v $law_single_party_state$#! 等）。"
  ipg_formula_2_desc:0 "最高均数法（除数 1, 2, 3, 4…）。欧陆应用最广的比例代表制，温和有利于大党与稳固执政联盟。\n议会规模：#v −5%#!（欧陆紧凑名单制）。"
  ipg_formula_2_cond:0 "非$language_anglophone$国家实行 #v $law_landed_voting$#!、#v $law_wealth_voting$#! 或 #v $law_census_voting$#!。"
  ipg_formula_3_desc:0 "奇数除数最高均数法（除数 1, 3, 5, 7…）。北欧与德国议会通行标准，对中小$concept_party$几乎无偏置。\n议会规模：#v +10%#!（含平衡补偿议席）。"
  ipg_formula_3_cond:0 "在 #v $law_parliamentary_republic$#! 或 #v $law_council_republic$#! 下实行 #v $law_universal_suffrage$#!。"
  ipg_formula_4_desc:0 "附带 #v 5%#! 议会门槛的比例代表制。$concept_votes$或$concept_clout$低于 5% 的边缘$concept_party$/$concept_interest_group$不获席位，有效减少议会碎片化。\n议会规模：#v −15%#!（精简整合）。"
  ipg_formula_4_cond:0 "#v $law_presidential_republic$#! 或 #v $law_monarchy$#! 下实行 #v $law_universal_suffrage$#!。"
  ipg_formula_5_desc:0 "仿效英美单一选区制（FPTP），扩大领先$concept_party$的多数席位优势，同时保留在野党代表权。\n议会规模：#v +25%#!（地方选区直选扩席）。"
  ipg_formula_5_cond:0 "主流文化属 #v $heritage_british$#! 或 #v $language_anglophone$#! 且拥有任意投票法律。"
