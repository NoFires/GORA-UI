  ipg_layout_westminster_cond:0 "• 主流文化具备 #v $heritage_british$#! 传承（$british$、$scottish$、$welsh$、$irish$，不含$australian$）或 #v $anglo_canadian$#!（非 #v $law_autocracy$#!）\n• 或实行 #v $law_parliamentary_republic$#!"
