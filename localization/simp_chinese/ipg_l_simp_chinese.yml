  ipg_layout_westminster_cond:0 "• 主流文化属于 #v 不列颠系#!（英格兰、苏格兰、威尔士、爱尔兰）或 #v 英裔加拿大#!（非专制）\n• 或实行 #v 议会共和制#!"
  ipg_layout_horseshoe_desc:0 "弧形 U 字马蹄议事厅，兼顾威斯敏斯特辩论传统与中立跨党派席位缓冲。"
