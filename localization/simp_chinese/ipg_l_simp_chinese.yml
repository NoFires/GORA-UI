  ipg_layout_auto_cond:0 "• #v 委员会 / 一党制#!：阶梯大会堂\n• #v 英国系文化（非专制）或议会共和#!：威斯敏斯特\n• #v 总统共和制（含选举法）#!：两院分席\n• #v 澳大利亚或其余君主立宪制#!：马蹄形\n• #v 专制 / 寡头 / 技术官僚等其余政体#!：经典半圆"
  ipg_layout_hemicycle_desc:0 "源自法国波旁宫的欧陆经典扇形半圆议事厅，以中轴主席台为核心呈弧形排布席位。"
