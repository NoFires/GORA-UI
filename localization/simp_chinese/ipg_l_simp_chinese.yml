  ipg_tab_foreign_electoral_tt:0 "#title $ipg_view_electoral$#!\n按该国活跃$concept_party$成员的$concept_clout$占比展示下院席位分布。\n#weak 尚无活跃$concept_party$时自动按权力结构展示。#!"
  ipg_tab_power_tt:0 "#title $ipg_view_power$#!\n按各$concept_interest_group$的$concept_clout$与现行议席分配制度展示上院席位分布。"
  ipg_tab_alignment_tt:0 "#title $ipg_view_alignment$#!\n按全境$concept_population$对各$concept_interest_group$的支持比例分配席位，并保留$concept_politically_unaligned$席位。"
