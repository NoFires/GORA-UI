 SMART_TRADE_TREATIES_TT:0 "#header Чистый доход по договорам#!\nОтправляемые товары: @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), GetPlayer.MakeScope.ScriptValue('st_player_treaty_money'))|D+=]\nРасходы на маршруты поставок: @money![Negate_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=] (оценка)\nПередача денег: @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_money')|D+=]\nПеревозка оплачивается торговыми кораблями по цене вашего рынка; больше портов снижает её.\nПодробности в списке договоров в Планировщике."
