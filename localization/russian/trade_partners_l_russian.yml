 TRADE_PARTNERS_KPI_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]:"
 TRADE_PARTNERS_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nИмпорт с [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Доля в импорте с этого рынка: #blue_value [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (из #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!)\n• Доля в экспорте [Goods.GetNameNoFormatting] партнёра: #v [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketExports, '(CFixedPoint)1'))|%1]#! (из #v [Goods.GetMarketExports|D]#!)"
 TRADE_PARTNERS_GOODS_EXPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nЭкспорт на [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Доля в экспорте на этот рынок: #gold_value [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (из #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!)\n• Доля в импорте [Goods.GetNameNoFormatting] партнёра: #v [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (из #v [Goods.GetMarketImports|D]#!)"
