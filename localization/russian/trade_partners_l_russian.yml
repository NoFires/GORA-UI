l_russian:
 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! Импортирует [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0] товаров с рынка [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! Экспортирует [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0] товаров на рынок [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(TradePartnersIsImporterFrom(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(TradePartnersIsExporterTo(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! Рынок [Market.GetName] экспортирует товары на рынок [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Количество: [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! Рынок [Market.GetName] импортирует товары с рынка [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Количество: [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! Рынок [Market.GetName] импортирует товары с рынка [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Количество: [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! Рынок [Market.GetName] экспортирует товары на рынок [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Количество: [TradePartnersGetExportsTo(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "Экспортируемые товары:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "Импортируемые товары:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "Экспортные партнёры"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "Импортные партнёры"
 TRADE_PARTNERS_TRADE_SURPLUS: "Торговый профицит"
 TRADE_PARTNERS_TRADE_DEFICIT: "Торговый дефицит"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]и, импортирующие товары с [Market.GetName] через [concept_world_market], в порядке доли в [Concept('concept_trade','$concept_exports|q$')].\nДвусторонние суммы рассчитываются по текущей [concept_world_market_price]."
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]и, экспортирующие товары на [Market.GetName] через [concept_world_market], в порядке доли в [Concept('concept_trade','$concept_imports|q$')].\nДвусторонние суммы рассчитываются по текущей [concept_world_market_price]."
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "Оценка по текущей [concept_world_market_price]"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_imports|q$')] с [Scope.GetMarket.GetName] составляет #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! общего импорта [Market.GetName]\n$TOOLTIP_DELIMITER$\n• С этого рынка: #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• Общий [Concept('concept_trade','$concept_imports|q$')] рынка: #v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exports|q$')] на [Scope.GetMarket.GetName] составляет #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! общего экспорта [Market.GetName]\n$TOOLTIP_DELIMITER$\n• На этот рынок: #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• Общий [Concept('concept_trade','$concept_exports|q$')] рынка: #v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nДвусторонний товарооборот: @money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] партнёру: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] от партнёра: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nС [Scope.GetMarket.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! Объём [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! Объём [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore По текущей [concept_world_market_price]#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nДвусторонняя стоимость: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Объём торговли: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nДвусторонняя стоимость: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Объём торговли: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nС [Market.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! Объём [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! Объём [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore По текущей [concept_world_market_price]#!"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nДвусторонняя стоимость: @money!#v [Multiply_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Объём торговли: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nДвусторонняя стоимость: @money!#v [Multiply_CFixedPoint(Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Объём торговли: #v [Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_HEADER_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]"
 TRADE_PARTNERS_HEADER_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]"
