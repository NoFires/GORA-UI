l_russian:
 # GORA UI+ — Advanced GDP Tracker: vanilla tooltip overrides
 # Adds GDP-growth, LARP fractions and per-state GDP breakdowns to vanilla
 # tooltips. Verified against vanilla 1.13.4 keys (RADICALS_TOOLTIP,
 # LOYALISTS_TOOLTIP, NEUTRALS_TOOLTIP, POP_TOOLTIP, GDP_TOOLTIP,
 # CURRENT_GDP_STATE).

 # ─── LARP-extended population & GDP tooltips ────────────────────────────
 RADICALS_TOOLTIP:1 "#tooltip_header $RADICALS$#!\n$RADICALS$ составляют #v [Country.GetNumRadicals|D]#! ([Country.MakeScope.ScriptValue('larp_radicals_percent')|%v1]) от общего населения (#v [Country.GetTotalPopulation|D]#!) [Country.GetAltName('RU_CL_RP')]\n$TOOLTIP_DELIMITER$\nС [Country.GetRadicalsLoyalistsChangeStartDate|v] количество [Concept('concept_radical', 'радикалов')] изменилось на #v #tooltippable #tooltip:[Country.GetTooltipTag],RADICALS_CHANGE_TOOLTIP [Country.GetTotalNumRadicalsChange|D=-]#!#!#!.\nВажнейшие факторы: [Country.GetRadicalsChangeSummary]\n\n[Country.GetRadicalsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( GreaterThan_int32(Country.CalcNumStatesInTurmoil, '(int32)0'), 'STATES_IN_TURMOIL', '' ))][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromRadicals, 'RADICALS_IG_APPROVAL', '' ))]"

 LOYALISTS_TOOLTIP:1 "#tooltip_header $LOYALISTS$#!\n$LOYALISTS$ составляют #v [Country.GetNumLoyalists|D]#! ([Country.MakeScope.ScriptValue('larp_loyalists_percent')|%v1]) от общего населения (#v [Country.GetTotalPopulation|D]#!) [Country.GetAltName('RU_CL_RP')]\n$TOOLTIP_DELIMITER$\nС [Country.GetRadicalsLoyalistsChangeStartDate|v] количество [Concept('concept_loyalist', 'лоялистов')] изменилось на #v #tooltippable #tooltip:[Country.GetTooltipTag],LOYALISTS_CHANGE_TOOLTIP [Country.GetTotalNumLoyalistsChange|D=+]#!#!#!.\nВажнейшие факторы: [Country.GetLoyalistsChangeSummary]\n\n[Country.GetLoyalistsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromLoyalists, 'LOYALISTS_IG_APPROVAL', '' ))]"

 NEUTRALS_TOOLTIP: "#tooltip_header $NEUTRALS$#!\n$NEUTRALS$ составляют #v [Country.GetNumNeutrals|*2]#! ([Country.MakeScope.ScriptValue('larp_neutrals_percent')|%v1]) от общего населения (#v [Country.GetTotalPopulation|*2]#!) [Country.GetAltName('RU_CL_RP')]"

 POP_TOOLTIP:2 "#tooltip_header [Concept('concept_pop', 'Население')]#!\nТекущее: [Country.GetTotalPopulation|*2v] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$\n$TOOLTIP_DELIMITER$\nНаселение [Country.GetAdjective] составляет [Country.MakeScope.ScriptValue('larp_global_pop_percent')|%v1] мирового населения\nМировое население: [Country.MakeScope.ScriptValue('larp_global_pop')|*2v]"

 GDP_TOOLTIP:1 "#header #tooltippable_name [Country.GetAdjective]ий#! [concept_gdp]#!\n@money![Country.GetGDP|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) принадлежащего стране ВВП ([Country.GetGDPRanking])\n@money![Country.GetGDPPerCapita|2*v] [Concept('concept_gdp_per_capita', 'ВВП на душу населения')] ([Country.GetGDPPerCapitaRanking])\n$GDPGR_growth_text$\n$TOOLTIP_DELIMITER$\nВВП [Country.GetAdjective] составляет [Country.MakeScope.ScriptValue('larp_global_gdp_percent')|%v2] мирового ВВП\nМировой ВВП: @money![Country.MakeScope.ScriptValue('larp_global_gdp')|Dv]"

 # ─── Per-state GDP breakdown ────────────────────────────────────────────
 CURRENT_GDP_STATE:2 "#header [State.GetOwner.GetAdjectiveNoFormatting]ий [concept_gdp|l] #tooltippable_name #tooltip:[State.GetTooltipTag],DATA_STATE_NAME_TOOLTIP,StateTooltip [State.GetCustom('RU_SL_RP')]#!#!#!\n$TOOLTIP_DELIMITER$\nТекущая доля в годовом ВВП: #variable @money![State.GetGDPContribution|K]#!\nВВП на душу населения [State.GetName]: #variable @money![State.MakeScope.ScriptValue('get_state_gdp_per')|Dv]#!\nОтклонение ВВП на душу населения [State.GetName] от [State.GetOwner.GetAdjectiveNoFormatting]: #variable @money![State.MakeScope.ScriptValue('get_country_state_relative_value')|D2+=]#!\nОтклонение ВВП на душу населения [State.GetName] от мирового среднего: #variable @money![State.MakeScope.ScriptValue('get_global_state_relative_value')|D2+=]#!\nОбласть [State.GetName] даёт #variable [State.GetGDPContributionPercentage|%1]#! от [State.GetOwner.GetAdjectiveNoFormatting|l]ого $GDP_SHORT$\n\n[State.GetGDPGoodsContributionBreakdown]"
