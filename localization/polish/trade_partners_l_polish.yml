l_polish:
 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! Importuje [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0] dobra z [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! Eksportuje [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0] dobra do [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(TradePartnersIsImporterFrom(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(TradePartnersIsExporterTo(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName] Eksportuje do [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Ilość: [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [Market.GetName] Importuje z [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Ilość: [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Market.GetName] Importuje z [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Ilość: [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName] Eksportuje do [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Ilość: [TradePartnersGetExportsTo(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "Eksportowane dobra:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "Importowane dobra:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "Partnerzy Eksportowi"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "Partnerzy Importowi"
 TRADE_PARTNERS_TRADE_SURPLUS: "Nadwyżka handlowa"
 TRADE_PARTNERS_TRADE_DEFICIT: "Deficyt handlowy"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]i importujące towary z [Market.GetName] przez [concept_world_market], uszeregowane według udziału w [Concept('concept_trade','$concept_exports|q$')].\nWartości dwustronne wyceniane są według aktualnej [concept_world_market_price]."
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]i eksportujące towary do [Market.GetName] przez [concept_world_market], uszeregowane według udziału w [Concept('concept_trade','$concept_imports|q$')].\nWartości dwustronne wyceniane są według aktualnej [concept_world_market_price]."
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "Wycena według aktualnej [concept_world_market_price]"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_imports|q$')] z [Scope.GetMarket.GetName] stanowi #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! całego importu [Market.GetName]\n$TOOLTIP_DELIMITER$\n• Z tego rynku: #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• Całkowity [Concept('concept_trade','$concept_imports|q$')] rynku: #v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exports|q$')] do [Scope.GetMarket.GetName] stanowi #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! całego eksportu [Market.GetName]\n$TOOLTIP_DELIMITER$\n• Na ten rynek: #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• Całkowity [Concept('concept_trade','$concept_exports|q$')] rynku: #v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nŁączny handel dwustronny: @money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] do partnera: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] od partnera: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nZ [Scope.GetMarket.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! Wartość [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! Wartość [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Wycenione według aktualnej [concept_world_market_price]#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nWartość dwustronna: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Wolumen: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nWartość dwustronna: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Wolumen: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nZ [Market.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! Wartość [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! Wartość [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Wycenione według aktualnej [concept_world_market_price]#!"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nWartość dwustronna: @money!#v [Multiply_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Wolumen: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nWartość dwustronna: @money!#v [Multiply_CFixedPoint(Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Wolumen: #v [Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_HEADER_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]"
 TRADE_PARTNERS_HEADER_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]"
 TRADE_PARTNERS_KPI_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]:"
 TRADE_PARTNERS_KPI_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]:"
 TRADE_PARTNERS_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nImport z [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Udział w imporcie z tego rynku: #blue_value [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (z #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!)\n• Udział w eksporcie [Goods.GetNameNoFormatting] partnera: #v [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketExports, '(CFixedPoint)1'))|%1]#! (z #v [Goods.GetMarketExports|D]#!)"
 TRADE_PARTNERS_GOODS_EXPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nEksport do [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Udział w eksporcie na ten rynek: #gold_value [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (z #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!)\n• Udział w imporcie [Goods.GetNameNoFormatting] partnera: #v [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (z #v [Goods.GetMarketImports|D]#!)"
 TRADE_PARTNERS_OTHER_EXPORT_SHARE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] ▶ [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exports|q$')] do [Market.GetName] stanowi #gold_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), Max_CFixedPoint(GetPlayer.GetMarket.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! całego eksportu [GetPlayer.GetMarket.GetName]\n$TOOLTIP_DELIMITER$\n• Na ten rynek: #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!\n• Całkowity [Concept('concept_trade','$concept_exports|q$')] rynku: #v [GetPlayer.GetMarket.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_OTHER_IMPORT_SHARE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] ◀ [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_imports|q$')] z [Market.GetName] stanowi #blue_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, GetPlayer.GetMarket), Max_CFixedPoint(GetPlayer.GetMarket.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! całego importu [GetPlayer.GetMarket.GetName]\n$TOOLTIP_DELIMITER$\n• Z tego rynku: #v [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|0D]#!\n• Całkowity [Concept('concept_trade','$concept_imports|q$')] rynku: #v [GetPlayer.GetMarket.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_OTHER_BAR_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\nŁączny handel dwustronny: @money!#v [Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] do partnera: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] od partnera: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nEksport do [Market.GetName]: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Udział w eksporcie na ten rynek: #gold_value [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), '(CFixedPoint)1'))|%1]#! (z #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!)\n• Udział w imporcie [Goods.GetNameNoFormatting] partnera: #v [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (z #v [Goods.GetMarketImports|D]#!)"
