  ipg_formula_reason_manual:0 "Mode de scrutin personnalisé appliqué à la Structure des partis, du pouvoir et à l'Alignement politique."
  ipg_formula_reason_1:0 "Adopte la proportionnelle #v Hare / Hamilton#! en l'absence de loi électorale."
  ipg_formula_reason_2:0 "Adopte la méthode #v D'Hondt#! sous #v $law_landed_voting$#! / #v $law_wealth_voting$#! / #v $law_census_voting$#!."
  ipg_formula_reason_3:0 "Adopte la méthode #v Sainte-Laguë#! sous #v $law_universal_suffrage$#! en #v $law_parliamentary_republic$#! ou #v $law_council_republic$#!."
  ipg_formula_reason_4:0 "Adopte le #v Seuil de 5 %#! sous #v $law_universal_suffrage$#! pour contenir la fragmentation parlementaire."
  ipg_formula_reason_5:0 "Adopte le scrutin #v Majoritaire (FPTP)#! selon la tradition #v $heritage_british$ / $language_anglophone$#!."
  ipg_formula_auto_desc:0 "Adapte le mode de répartition des sièges à votre loi de $lawgroup_distribution_of_power$ et à votre tradition constitutionnelle."
  ipg_formula_auto_cond:0 "• #v Sans loi électorale#! : Hare / Hamilton\n• #v $heritage_british$ / $language_anglophone$#! (avec suffrage) : Majoritaire (FPTP)\n• #v $law_universal_suffrage$#! (#v $law_parliamentary_republic$ / $law_council_republic$#!) : Sainte-Laguë\n• #v $law_universal_suffrage$#! (autres) : Seuil de 5 %\n• #v $law_landed_voting$ / $law_wealth_voting$ / $law_census_voting$#! (autres) : D'Hondt"
  ipg_formula_1_desc:0 "Scrutin au plus fort reste (quotient de Hare), strictement proportionnel.\nTaille de la chambre : #v standard (100 %)#!."
  ipg_formula_1_cond:0 "Régimes sans loi électorale (#v $law_autocracy$#!, #v $law_oligarchy$#!, #v $law_technocracy$#!, #v $law_single_party_state$#!)."
  ipg_formula_2_desc:0 "Plus forte moyenne (diviseurs 1, 2, 3, 4…). Favorise légèrement les grands partis.\nTaille de la chambre : #v −5 %#!."
  ipg_formula_2_cond:0 "Pays non-$language_anglophone$ sous #v $law_landed_voting$#!, #v $law_wealth_voting$#! ou #v $law_census_voting$#!."
  ipg_formula_3_desc:0 "Diviseurs impairs (1, 3, 5, 7…). Standard scandinave équilibré pour tous les partis.\nTaille de la chambre : #v +10 %#! (sièges compensatoires)."
  ipg_formula_3_cond:0 "#v $law_universal_suffrage$#! avec #v $law_parliamentary_republic$#! ou #v $law_council_republic$#!."
  ipg_formula_4_desc:0 "Proportionnelle avec seuil de #v 5 %#!. Les factions sous 5 % n'obtiennent aucun siège.\nTaille de la chambre : #v −15 %#!."
  ipg_formula_4_cond:0 "#v $law_universal_suffrage$#! sous #v $law_presidential_republic$#! ou #v $law_monarchy$#!."
  ipg_formula_5_desc:0 "Prime majoritaire par circonscriptions uninominales renforçant les majorités de gouvernement.\nTaille de la chambre : #v +25 %#!."
  ipg_formula_5_cond:0 "Cultures #v $heritage_british$#! ou #v $language_anglophone$#! avec loi électorale."
