 rule_trade_partners_chart_display: "Graphiques des partenaires commerciaux"
 rule_trade_partners_chart_display_desc: "Détermine si les graphiques des partenaires commerciaux sont calculés et affichés dans le panneau du marché."
 setting_trade_partner_show_all: "Tout afficher"
 setting_trade_partner_show_all_desc: "Calculer et afficher les partenaires commerciaux pour tous les marchés actifs (IA et joueurs)."
 setting_trade_partner_players_only: "Joueurs uniquement"
