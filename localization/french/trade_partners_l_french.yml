 TRADE_PARTNERS_OTHER_BAR_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\nCommerce bilatéral total: @money!#v [Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] vers ce partenaire: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] depuis ce partenaire: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nExporté vers [Market.GetName]: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Part des [Concept('concept_trade','$concept_exports|q$')] vers ce marché: #gold_value [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), '(CFixedPoint)1'))|%1]#! (sur #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!)\n• Part des importations de [Goods.GetNameNoFormatting] du partenaire: #v [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (sur #v [Goods.GetMarketImports|D]#!)"
