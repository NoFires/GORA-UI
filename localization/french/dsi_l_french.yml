l_french:
 DSI_GDP_HEADER_TOOLTIP:0 "#header State [concept_gdp] contribution#!\nAnnual [concept_gdp] generated in this state and its share of the national total."
 DSI_POP_HEADER_TOOLTIP:0 "#header State $concept_population$#!\nTotal population of this state."
 DSI_SOL_HEADER_TOOLTIP:0 "#header Average [concept_sol]#!\nAverage [concept_sol] of all pops in this state."
 DSI_PEASANTS_HEADER_TOOLTIP:0 "#header $peasants_no_icon$#!\nNumber of peasants working in subsistence buildings in this state."
 DSI_TRAITS_HEADER_TOOLTIP:0 "#header State Traits#!\nGeographic and economic traits of this state (e.g. terrain, resource deposits) and their bonuses."
 DSI_FILTER_ALL:0 "All"
 DSI_FILTER_ALL_TOOLTIP:0 "Reset all filters and show every state."
 DSI_FILTER_INCORPORATED:0 "Incorporated"
 DSI_FILTER_INCORPORATED_ON:0 "@green_checkmark! Incorporated"
 DSI_FILTER_INCORPORATED_TOOLTIP:0 "Only show incorporated states."
 DSI_FILTER_PEASANTS:0 "Peasants"
 DSI_FILTER_PEASANTS_ON:0 "@green_checkmark! Peasants"
 DSI_FILTER_PEASANTS_TOOLTIP:0 "Only show states with peasants in subsistence buildings."
 DSI_FILTER_NOT_ENACTED:0 "Without decree"
 DSI_FILTER_NOT_ENACTED_ON:0 "@green_checkmark! Without decree"
 DSI_FILTER_NOT_ENACTED_TOOLTIP:0 "Hide states where this decree cannot be newly enacted (already active or unavailable)."
 DSI_FILTER_ENACTED:0 "With decree"
 DSI_FILTER_ENACTED_ON:0 "@green_checkmark! With decree"
 DSI_FILTER_ENACTED_TOOLTIP:0 "Only show states where this decree is already active (or cannot be newly enacted)."
 DSI_VAL_GDP_HI:0 "#P @money![State.GetGDPContribution|K]#!"
 DSI_VAL_POP_MID:0 "#light_green [State.GetPopulationSize|K]#!"
 DSI_VAL_POP_HI:0 "#P [State.GetPopulationSize|K]#!"
 DSI_VAL_SOL_LOW:0 "#N [State.GetAverageStandardOfLivingAll|1]#!"
 DSI_VAL_PEASANTS_HI:0 "#yellow #bold [State.GetNumSubsistenceWorkingAdults|K]#!#!"
