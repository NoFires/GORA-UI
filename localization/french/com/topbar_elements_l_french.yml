l_french:
 com_topbar_base_game_source: "Victoria 3"
 com_topbar_base_game_source_tooltip: "Cet élément est rajouté par défaut par le mod Expanded Topbar Framework."

 # Prestige
 com_topbar_element_prestige: "com_topbar_element_prestige"
 com_topbar_element_prestige_icon: "@prestige!"
 com_topbar_element_prestige_value: "[GetPlayer.GetPrestige|v]"
 com_topbar_element_prestige_tooltip: "[GetPlayer.GetRankTooltip]"
 com_topbar_element_prestige_source: "$com_topbar_base_game_source$"
 com_topbar_element_prestige_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_prestige_map_mode: "mm_country_attitude"
 com_topbar_element_prestige_window: "com_topbar_prestige"

 # Power Bloc Prestige
 com_topbar_element_bloc_prestige: "com_topbar_element_bloc_prestige"
 com_topbar_element_bloc_prestige_icon: "@com_power_bloc_prestige!"
 com_topbar_element_bloc_prestige_value: "[GetPlayer.GetPowerBloc.GetTotalPrestige|v]"
 com_topbar_element_bloc_prestige_tooltip: "#header [concept_prestige] du bloc [GetPlayer.GetPowerBloc.GetName]#!\nTotal : @prestige![GetPlayer.GetPowerBloc.GetTotalPrestige|v]\n$TOOLTIP_DELIMITER$\n[AccessPlayer.AccessPowerBloc.GetPrestigeDesc]"
 com_topbar_element_bloc_prestige_source: "$com_topbar_base_game_source$"
 com_topbar_element_bloc_prestige_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_bloc_prestige_map_mode: "mm_power_blocs"
 com_topbar_element_bloc_prestige_window: "com_topbar_power_bloc"

 # Power Bloc Cohesion
 com_topbar_element_bloc_cohesion: "com_topbar_element_bloc_cohesion"
 com_topbar_element_bloc_cohesion_icon: "@cohesion!"
 com_topbar_element_bloc_cohesion_value: "[GetPlayer.GetPowerBloc.GetCohesion|v0]"
 com_topbar_element_bloc_cohesion_tooltip: "#header [GetPlayer.GetPowerBloc.GetCohesionLevel.GetNameNoFormatting]#! $COHESION_LEVEL_ACTIVE$\nValeur de [concept_power_bloc_cohesion|l] actuelle : [SelectLocalization(EqualTo_CFixedPoint(GetPlayer.GetPowerBloc.GetCohesion, GetPlayer.GetPowerBloc.GetCohesionTarget), 'com_topbar_element_bloc_cohesion_tooltip_value_without', 'com_topbar_element_bloc_cohesion_tooltip_value_with')]\nÉvolution hebdomadaire vers l’objectif : #v [GetPlayer.GetPowerBloc.GetCohesionWeeklyChange|+=1]#!\n$TOOLTIP_DELIMITER$\n#indent_newline:3 #title Effets :\n[GetPlayer.GetPowerBloc.GetCohesionLevel.GetEffects]#!#!\n\n#title Ceci s’explique par :#!#indent_newline:3 \n[GetPlayer.GetPowerBloc.GetCohesionDesc]"
 com_topbar_element_bloc_cohesion_tooltip_value_with: "[GetPlayer.GetPowerBloc.GetCohesion|v0] @arrow_right! [GetPlayer.GetPowerBloc.GetCohesionTarget|v0]"
 com_topbar_element_bloc_cohesion_tooltip_value_without: "[GetPlayer.GetPowerBloc.GetCohesion|v0]"
 com_topbar_element_bloc_cohesion_source: "$com_topbar_base_game_source$"
 com_topbar_element_bloc_cohesion_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_bloc_cohesion_map_mode: "mm_power_blocs"
 com_topbar_element_bloc_cohesion_window: "com_topbar_power_bloc"

 # Power Bloc Size
 com_topbar_element_bloc_size: "com_topbar_element_bloc_size"
 com_topbar_element_bloc_size_icon: "@com_power_bloc_size!"
 com_topbar_element_bloc_size_value: "#v [GetPlayer.GetPowerBloc.GetNumMembers]#!"
 com_topbar_element_bloc_size_tooltip: "#header [GetPlayer.GetPowerBloc.GetNumMembers] [Concept('concept_country','$concept_countries|q$')|l] dans le bloc [GetPlayer.GetPowerBloc.GetName]#!\n$TOOLTIP_DELIMITER$\n[GetPlayer.GetPowerBloc.GetMembersBreakdown]"
 com_topbar_element_bloc_size_source: "$com_topbar_base_game_source$"
 com_topbar_element_bloc_size_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_bloc_size_map_mode: "mm_power_blocs"
 com_topbar_element_bloc_size_window: "com_topbar_power_bloc"

 # Government Legitimacy
 com_topbar_element_legitimacy: "com_topbar_element_legitimacy"
 com_topbar_element_legitimacy_icon: "@legitimacy_icon!"
 com_topbar_element_legitimacy_value: "[GetPlayer.GetGovernmentLegitimacy|v]"
 com_topbar_element_legitimacy_tooltip: "#header [GetPlayer.GetGovernmentLegitimacyLevel.GetNameNoFormatting]#! $LEGITIMACY_LEVEL_ACTIVE$\nS’applique entre [GetPlayer.GetGovernmentLegitimacyLevel.GetLowerBound|v] et [GetPlayer.GetGovernmentLegitimacyLevel.GetUpperBound|v] de [concept_legitimacy|l]\n$LEGITIMACY_LEVEL_CURRENT_LEGITIMACY_DESC$\n$TOOLTIP_DELIMITER$\n#title Effets :#!#indent_newline:3 \n[GetPlayer.GetGovernmentLegitimacyLevel.GetEffectsWithLoyaltiesGain(GetPlayer.Self)]#!\n\n#title Ceci s’explique par :#!#indent_newline:3 \n[GetPlayer.GetGovernmentLegitimacyDesc]#!"
 com_topbar_element_legitimacy_source: "$com_topbar_base_game_source$"
 com_topbar_element_legitimacy_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_legitimacy_map_mode: "mm_political"
 com_topbar_element_legitimacy_window: "com_topbar_politics"

 # Country Innovation
 com_topbar_element_innovation: "com_topbar_element_innovation"
 com_topbar_element_innovation_icon: "@innovation!"
 com_topbar_element_innovation_value: "[GetPlayer.GetWeeklyInnovation|0v]"
 com_topbar_element_innovation_tooltip: "#header [concept_innovation]#!\n[GetPlayer.GetName] génère #v [GetPlayer.GetWeeklyInnovation|+2]@innovation!#! [concept_innovation|l] chaque semaine :\n[GetPlayer.GetWeeklyInnovationDesc]\n\nUn maximum de [GetPlayer.GetWeeklyMaxInnovation|v2]@innovation! [concept_innovation|l] peuvent être investis dans la recherche en cours chaque semaine :\n[GetPlayer.GetWeeklyMaxInnovationDesc]\n\nToute [concept_innovation|l] qui n’est pas dépensée en raison de plafonds d’investissement ou de l’absence de recherche en cours augmentera le taux de [concept_technology_spread|l] de notre pays."
 com_topbar_element_innovation_source: "$com_topbar_base_game_source$"
 com_topbar_element_innovation_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_innovation_map_mode: "mm_literacy"
 com_topbar_element_innovation_window: "com_topbar_innovation"

 # Number of Companies
 com_topbar_element_companies: "com_topbar_element_companies"
 com_topbar_element_companies_icon: "@com_company!"
 com_topbar_element_companies_value: "[GetPlayer.GetNumCompanies|v] / [GetPlayer.GetMaxNumCompanies|v]"
 com_topbar_element_companies_tooltip: "#header [Concept('concept_company','$concept_companies|q$')]#!\n[GetPlayer.GetMaxNumCompaniesDesc]"
 com_topbar_element_companies_source: "$com_topbar_base_game_source$"
 com_topbar_element_companies_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_companies_window: "com_topbar_companies"

 # Number of Company Charters
 com_topbar_element_charters: "com_topbar_element_charters"
 com_topbar_element_charters_icon: "@com_company_charters!"
 com_topbar_element_charters_value: "[GetPlayer.GetUsedFreeCharters|v] / [GetPlayer.GetModifier.GetValueFor('country_free_charters_add')]"
 com_topbar_element_charters_tooltip: "#header [Concept('concept_company_charter','$concept_company_charters|q$')]#!\nUtilisation de [GetPlayer.GetUsedFreeCharters|v] / [GetPlayer.GetModifier.GetValueWithBreakdownFor('country_free_charters_add')] [Concept('concept_company_charter','$concept_company_charters|q$')] gratuits."
 com_topbar_element_charters_source: "$com_topbar_base_game_source$"
 com_topbar_element_charters_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_charters_window: "com_topbar_companies"

 # Army Size
 com_topbar_element_army_size: "com_topbar_element_army_size"
 com_topbar_element_army_size_icon: "@battalions!"
 com_topbar_element_army_size_value: "[GetPlayer.GetRegularBattalions|v] + [GetPlayer.CalcConscriptableBattalions|v]"
 com_topbar_element_army_size_tooltip: "#header [Concept('concept_battalion', '$concept_battalions|q$')] [GetPlayer.GetAltAdjective('MP')|l]#!\nActuellement : #v [GetPlayer.GetBattalions|v]#!@battalions! ([GetPlayer.GetBattalionsRanking])\n$TOOLTIP_DELIMITER$\n[GetPlayer.GetAltNameNoFormatting('Le')|U][GetPlayer.GetName] [GetPlayer.GetAltNameNoFormatting('AOnt')] #v [GetPlayer.GetBattalions]#! [Concept('concept_battalion', '$concept_battalions|q$')|l]@battalions! (#v [GetPlayer.GetMobilizationRatio|0%]#! @mobilization! [Concept('concept_mobilize_battalion', '$concept_mobilize_battalion_mobilized|q$s')|l])\nLe nombre total de [Concept('concept_battalion', '$concept_battalions|q$')|l] [GetPlayer.GetAltAdjective('MP')|l] et leur sophistication technologique aboutissent à une [concept_power_projection|l] de l’armée de #tooltippable #tooltip:[GetPlayer.GetTooltipTag],PANEL_MILITARY_ARMY_POWER_PROJECTION_TOOLTIP [GetPlayer.GetArmyPowerProjection|Dv0]#!#!\n\n[Concept('concept_army','$concept_armies|q$')]:\n[SelectLocalization(IsDataModelEmpty(AccessPlayer.GetMilitaryFormationsArmy), 'com_topbar_element_army_size_tooltip_no_army', 'com_topbar_element_army_size_tooltip_armies')]"
 com_topbar_element_army_size_tooltip_armies: "[AccessPlayer.GetArmiesBreakdown]"
 com_topbar_element_army_size_tooltip_no_army: "Aucune [Concept('concept_army','armée')|l] [GetPlayer.GetAltNameNoFormatting('En')][GetPlayer.GetName]"
 com_topbar_element_army_size_source: "$com_topbar_base_game_source$"
 com_topbar_element_army_size_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_army_size_map_mode: "mm_military_formation"
 com_topbar_element_army_size_window: "com_topbar_army"

 # Navy Size
 com_topbar_element_navy_size: "com_topbar_element_navy_size"
 com_topbar_element_navy_size_icon: "@ships!"
 com_topbar_element_navy_size_value: "[GetPlayer.GetNumShips|0v]"
 com_topbar_element_navy_size_tooltip: "#header $SHIPS_CONCEPT$ [GetPlayer.GetAltAdjectiveNoFlag('MP')|l]#!\nActuellement : [Nbsp][GetPlayer.GetNumShips|v]@ships! ([GetPlayer.GetShipsRanking])\n$TOOLTIP_DELIMITER$\nLe nombre total de navires [GetPlayer.GetAltAdjective('MP')|l] et leur sophistication technologique aboutissent à une [concept_power_projection|l] de la marine de #tooltippable #tooltip:[GetPlayer.GetTooltipTag],PANEL_MILITARY_NAVY_POWER_PROJECTION_TOOLTIP [GetPlayer.GetNavyPowerProjection|Dv]#!#!\n\n[Concept('concept_fleet','$concept_fleets|q$')]:\n[SelectLocalization(IsDataModelEmpty(AccessPlayer.GetMilitaryFormationsFleet), 'com_topbar_element_navy_size_tooltip_no_fleets', 'com_topbar_element_navy_size_tooltip_fleets')]"
 com_topbar_element_navy_size_tooltip_fleets: "[AccessPlayer.GetFleetsBreakdown]"
 com_topbar_element_navy_size_tooltip_no_fleets: "Pas de [Concept('concept_fleet','$concept_fleets|q$')|l] [GetPlayer.GetAltNameNoFormatting('En')][GetPlayer.GetName]"
 com_topbar_element_navy_size_source: "$com_topbar_base_game_source$"
 com_topbar_element_navy_size_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_navy_size_map_mode: "mm_military_formation"
 com_topbar_element_navy_size_window: "com_topbar_navy"

