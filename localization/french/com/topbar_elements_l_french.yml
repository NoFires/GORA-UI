 # Market Balance
 com_topbar_element_market_balance: "com_topbar_element_market_balance"
 com_topbar_element_market_balance_icon: "@market_balance!"
 com_topbar_element_market_balance_value: "[GetPlayer.GetMarket.GetBalance|+=D]"
 com_topbar_element_market_balance_tooltip: "[GetPlayer.GetMarket.GetBalanceDesc]"
 com_topbar_element_market_balance_source: "$com_topbar_base_game_source$"
 com_topbar_element_market_balance_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_market_balance_map_mode: "mm_market_areas"
 com_topbar_element_market_balance_window: "com_topbar_market"

 # Market GDP_balance
 com_topbar_element_market_gdp: "com_topbar_element_market_gdp"
 com_topbar_element_market_gdp_icon: "@market_production!"
 com_topbar_element_market_gdp_value: "[GetPlayer.GetMarket.GetMarketGDPValue|*v2]"
 com_topbar_element_market_gdp_tooltip: "#header Marché $concept_gdp$#!\nLe [GetPlayer.GetMarket.GetName] affiche un [concept_gdp] de @money![GetPlayer.GetMarket.GetMarketGDPValue|*v2].\nIl représente [GetPlayer.GetMarket.GetGDPContributionPercentage(GetPlayer)|v%0] du [concept_gdp] de [GetPlayer.GetName]."
 com_topbar_element_market_gdp_source: "$com_topbar_base_game_source$"
 com_topbar_element_market_gdp_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_market_gdp_map_mode: "mm_market_areas"
 com_topbar_element_market_gdp_window: "com_topbar_market"

 # Trade Capacity
 com_topbar_element_trade_capacity: "com_topbar_element_trade_capacity"
 com_topbar_element_trade_capacity_icon: "@com_trade_capacity!"
 com_topbar_element_trade_capacity_value: "[GetPlayer.GetMarket.GetTradeCapacity|v0]"
 com_topbar_element_trade_capacity_tooltip: "[GetPlayer.GetMarket.GetTradeCapacityDesc]."
 com_topbar_element_trade_capacity_source: "$com_topbar_base_game_source$"
 com_topbar_element_trade_capacity_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_trade_capacity_map_mode: "mm_market_areas"
 com_topbar_element_trade_capacity_window: "com_topbar_market"

 # Sailors
 com_topbar_element_sailors: "com_topbar_element_sailors"
 com_topbar_element_sailors_icon: "@crew!"
 com_topbar_element_sailors_value: "[GetPlayer.GetNeededSailors|vD] / [GetPlayer.GetModifier.GetValueFor('country_sailors_max_add')|vD]"
 com_topbar_element_sailors_tooltip: "#header [Concept('concept_sailor', '$concept_sailors|q$')]#!\n$com_topbar_element_sailors_tooltip_balance_lines$[AddLocalizationIf(Not(StringIsEmpty(GetPlayer.GetSailorCapacityBreakdown)), 'com_topbar_element_sailors_tooltip_breakdown_section')]"
 com_topbar_element_sailors_tooltip_balance_lines: "[SelectLocalization(GetPlayer.HasSailorDeficit, 'com_topbar_element_sailors_tooltip_balance_deficit_line', 'com_topbar_element_sailors_tooltip_balance_neutral_line')]\n@crew! #v [GetPlayer.GetAvailableSailors|D]#! available from our [GetBuildingType('building_naval_administration').GetName] [Concept('concept_building', '$concept_buildings|q$')]\n@crew! #v [GetPlayer.GetNeededSailors|D]#! needed to fully [Concept('concept_ship_crew', '$concept_ship_crew_present|q$')] our [Concept('concept_ship', '$concept_ships|q$')][AddLocalizationIf(GreaterThan_int32(GetPlayer.GetNeededSailorsForShipConstruction, '(int32)0'), 'com_topbar_element_sailors_tooltip_balance_needed_by_queue')][AddLocalizationIf(GreaterThan_int32(GetPlayer.GetNumShipsShortOfSailorCapacity, '(int32)0'), 'com_topbar_element_sailors_tooltip_balance_deficit_warning')][AddLocalizationIf(And(EqualTo_int32(GetPlayer.GetNumShipsShortOfSailorCapacity, '(int32)0'), GreaterThan_int32(GetPlayer.GetNumQueuedShipsShortOfSailorCapacity, '(int32)0')), 'com_topbar_element_sailors_tooltip_balance_deficit_queue_warning')][AddLocalizationIf(And(GetPlayer.HasSailorDeficit, EqualTo_int32(GetPlayer.GetNumShipsShortOfSailorCapacity, '(int32)0')), 'com_topbar_element_sailors_tooltip_balance_staffing_line')]"
 com_topbar_element_sailors_tooltip_balance_deficit_line: "@crew! #n [Negate_int32(GetPlayer.GetSailorBalance)|D]#! [SelectLocalization(EqualTo_int32(Negate_int32(GetPlayer.GetSailorBalance), '(int32)1'), 'concept_sailor', 'concept_sailors')] short"
 com_topbar_element_sailors_tooltip_balance_neutral_line: "@crew! #v [GetPlayer.GetSailorBalance|D]#! [SelectLocalization(EqualTo_int32(GetPlayer.GetSailorBalance, '(int32)1'), 'concept_sailor', 'concept_sailors')] idle[AddLocalizationIf(LessThan_int32(GetPlayer.GetCurrentSailors, GetPlayer.GetNeededSailors), 'com_topbar_element_sailors_tooltip_balance_once_crewed')]"
 com_topbar_element_sailors_tooltip_balance_once_crewed: " once every $concept_ship$ is fully $concept_ship_crew_past$"
 com_topbar_element_sailors_tooltip_balance_needed_by_queue: "\n@crew! #v [GetPlayer.GetNeededSailorsForShipConstruction|D]#! will be needed by $concept_ships$ in the [concept_ship_construction_queue]"
 com_topbar_element_sailors_tooltip_balance_deficit_warning: "\n@warning! #n #v [GetPlayer.GetNumShipsShortOfSailorCapacity|D]#! out of #v [GetPlayer.GetNumCrewableShips|D]#! $concept_ships$ cannot be fully $concept_ship_crew_past$#!"
 com_topbar_element_sailors_tooltip_balance_deficit_queue_warning: "\n@warning! #n #v [GetPlayer.GetNumQueuedShipsShortOfSailorCapacity|D]#! out of #v [GetPlayer.GetNumQueuedShips|D]#! queued $concept_ships$ will not be fully $concept_ship_crew_past$#!"
 com_topbar_element_sailors_tooltip_breakdown_section: "\n$TOOLTIP_DELIMITER$\n#title $concept_sailors$ from each [GetBuildingType('building_naval_administration').GetName]:#!#indent_newline:3 \n[GetPlayer.GetSailorCapacityBreakdown]#!"
 com_topbar_element_sailors_tooltip_balance_staffing_line: "[SelectLocalization(GetPlayer.IsGainingSailors, 'COUNTRY_SAILORS_HIRING_LINE', 'COUNTRY_SAILORS_NOT_HIRING_LINE')]"
 com_topbar_element_sailors_source: "$com_topbar_base_game_source$"
 com_topbar_element_sailors_source_tooltip: "$com_topbar_base_game_source_tooltip$"
 com_topbar_element_sailors_map_mode: "mm_military_formation"
 com_topbar_element_sailors_window: "com_topbar_navy"