l_french:
 # GORA UI+ — Override vanilla notification descriptions to include character details
 # (interest group, ideology, traits). Uses helper fragments from
 # `localization/english/00_gora_agitator_notifications_l_english.yml`.
 # Keys verified against vanilla 1.13.4:
 #   character_interactions_l_english.yml:40  — notification_exile_notification_desc
 #   interfaces_l_english.yml:7544            — notification_agitator_spawned_desc
 #   interfaces_l_english.yml:7580            — notification_heir_born_notification_desc
 #   interfaces_l_english.yml:10514           — notification_new_ruler_desc
 # File lives in localization/english/replace/ so it overrides the vanilla string.

 notification_exile_notification_desc: "[SCOPE.sCharacter('exile_scope').GetFullName] a été envoyé[SCOPE.sCharacter('exile_scope').GetCustom('FR_E')] [Concept('concept_exile', '$concept_in_exile$')|l] par [SCOPE.sCountry('exiling_country_scope').GetAltNameNoFormatting('Le')][SCOPE.sCountry('exiling_country_scope').GetName].\n$gora_dan_agitator_interest_group$\n$gora_dan_agitator_ideology$\n$gora_dan_agitator_traits$"

 notification_new_ruler_desc: "Le règne de [SCOPE.sCharacter( 'previous' ).GetFullName] en tant que [concept_ruler|l] est révolu. [SCOPE.GetRootScope.GetCharacter.GetFullName] est désormais le [Concept('concept_ruler', SCOPE.GetRootScope.GetCharacter.GetPrimaryRoleTitle)|l] du [SCOPE.GetRootScope.GetCharacter.GetCountry.GetName]\n$gora_dan_ruler_interest_group$\n$gora_dan_ruler_ideology$\n$gora_dan_ruler_traits$"

 notification_heir_born_notification_desc:0 "[SCOPE.GetRootScope.GetCharacter.GetFullName], [concept_heir|l] du trône [SCOPE.GetRootScope.GetCharacter.GetCountry.GetAltNameNoFormatting('Du')][SCOPE.GetRootScope.GetCharacter.GetCountry.GetName], est né[SCOPE.GetRootScope.GetCharacter.GetCustom('FR_E')]\n$gora_dan_ruler_interest_group$\n$gora_dan_ruler_ideology$\n$gora_dan_ruler_traits$"

 notification_agitator_spawned_desc:1 "[SCOPE.sCha('character').GetAgitatorSpawnedNotificationText]\n$gora_dan_spawn_interest_group$\n$gora_dan_spawn_ideology$\n$gora_dan_spawn_traits$"
