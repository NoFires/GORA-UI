 TRADE_PARTNERS_OTHER_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exported|q$')] to [Market.GetName]: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Share of [Concept('concept_trade','$concept_exports|q$')] to this market: #gold_value [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), '(CFixedPoint)1'))|%1]#! (of #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!)\n• Share of partner's [Goods.GetNameNoFormatting] [Concept('concept_trade','$concept_imports|q$')]: #v [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (of #v [Goods.GetMarketImports|D]#!)"
