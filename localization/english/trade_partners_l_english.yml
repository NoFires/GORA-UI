l_english:
 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! Imports [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0] total goods from the [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! Exports [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0] total goods to the [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(TradePartnersIsImporterFrom(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(TradePartnersIsExporterTo(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName] Exports to the [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Amount: [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [Market.GetName] Imports from the [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Amount: [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Market.GetName] Imports from the [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Amount: [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName] Exports to the [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Amount: [TradePartnersGetExportsTo(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "Exported goods:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "Imported goods:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "Export Partners"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "Import Partners"
 TRADE_PARTNERS_TRADE_SURPLUS: "Trade Surplus"
 TRADE_PARTNERS_TRADE_DEFICIT: "Trade Deficit"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]s [Concept('concept_trade','$concept_importing|q$')] goods from [Market.GetName] via the [concept_world_market], ranked by share of [Concept('concept_trade','$concept_exports|q$')].\nBilateral values are valued at the current [concept_world_market_price]."
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]s [Concept('concept_trade','$concept_exporting|q$')] goods to [Market.GetName] via the [concept_world_market], ranked by share of [Concept('concept_trade','$concept_imports|q$')].\nBilateral values are valued at the current [concept_world_market_price]."
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "Valued at the current [concept_world_market_price]"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_imports|q$')] from [Scope.GetMarket.GetName] account for #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! of [Market.GetName]'s total [Concept('concept_trade','$concept_imports|q$')]\n$TOOLTIP_DELIMITER$\n• From this market: #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• Market total [Concept('concept_trade','$concept_imports|q$')]: #v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exports|q$')] to [Scope.GetMarket.GetName] account for #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! of [Market.GetName]'s total [Concept('concept_trade','$concept_exports|q$')]\n$TOOLTIP_DELIMITER$\n• To this market: #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• Market total [Concept('concept_trade','$concept_exports|q$')]: #v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nTotal Bilateral Trade: @money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] to partner: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] from partner: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nWith [Scope.GetMarket.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] Value: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] Value: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Valued at the current [concept_world_market_price]#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateral Value: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Traded Volume: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateral Value: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Traded Volume: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nWith [Market.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] Value: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] Value: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Valued at the current [concept_world_market_price]#!"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateral Value: @money!#v [Multiply_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Traded Volume: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateral Value: @money!#v [Multiply_CFixedPoint(Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Traded Volume: #v [Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_HEADER_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]"
 TRADE_PARTNERS_HEADER_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]"
 TRADE_PARTNERS_KPI_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]:"
 TRADE_PARTNERS_KPI_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]:"
 TRADE_PARTNERS_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_imported|q$')] from [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Share of [Concept('concept_trade','$concept_imports|q$')] from this market: #blue_value [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (of #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!)\n• Share of partner's [Goods.GetNameNoFormatting] [Concept('concept_trade','$concept_exports|q$')]: #v [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketExports, '(CFixedPoint)1'))|%1]#! (of #v [Goods.GetMarketExports|D]#!)"
 TRADE_PARTNERS_GOODS_EXPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exported|q$')] to [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Share of [Concept('concept_trade','$concept_exports|q$')] to this market: #gold_value [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (of #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!)\n• Share of partner's [Goods.GetNameNoFormatting] [Concept('concept_trade','$concept_imports|q$')]: #v [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (of #v [Goods.GetMarketImports|D]#!)"
 TRADE_PARTNERS_OTHER_EXPORT_SHARE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] ▶ [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exports|q$')] to [Market.GetName] account for #gold_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), Max_CFixedPoint(GetPlayer.GetMarket.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! of [GetPlayer.GetMarket.GetName]'s total [Concept('concept_trade','$concept_exports|q$')]\n$TOOLTIP_DELIMITER$\n• To this market: #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!\n• Market total [Concept('concept_trade','$concept_exports|q$')]: #v [GetPlayer.GetMarket.GetTotalExportedAmount|D]#!"
