  ipg_layout_auto_desc:0 "Adapts the chamber layout automatically to your $lawgroup_governance_principles$, $lawgroup_distribution_of_power$, and parliamentary heritage."
  ipg_layout_auto_cond:0 "• #v $law_council_republic$ / $law_single_party_state$#!: Assembly\n• #v $heritage_british$ / $anglo_canadian$#! (non-$law_autocracy$) or #v $law_parliamentary_republic$#!: Westminster\n• #v $law_presidential_republic$#! (with voting law): Bicameral\n• #v $australian$#! or other #v $law_monarchy$#! (with voting law): Horseshoe\n• #v $law_autocracy$ / $law_oligarchy$ / $law_technocracy$#! & others: Hemicycle"
  ipg_layout_hemicycle_desc:0 "Classic continental European fan-shaped amphitheater inspired by the Palais Bourbon, radiating outward from the presiding dais."
  ipg_layout_hemicycle_cond:0 "Standard chamber for #v $law_autocracy$#!, #v $law_oligarchy$#!, #v $law_technocracy$#!, and regimes without a distinct parliamentary tradition."
  ipg_layout_westminster_desc:0 "Iconic opposing benches inspired by the Palace of Westminster, with Government and Opposition facing each other across the aisle."
  ipg_layout_westminster_cond:0 "• Primary culture with #v $heritage_british$#! heritage (excl. $australian$) or #v $anglo_canadian$#! (non-$law_autocracy$)\n• Or enacted #v $law_parliamentary_republic$#!"
  ipg_layout_horseshoe_desc:0 "Curved U-shaped Commonwealth chamber blending Westminster debate traditions with cross-bench consensus seating."
  ipg_layout_horseshoe_cond:0 "• Primary culture is #v $australian$#! (non-$law_autocracy$)\n• Or non-$heritage_british$ #v $law_monarchy$#! with any voting law"
  ipg_layout_assembly_desc:0 "Stepped rectilinear congress hall with ranked seating rows facing the central presidium."
  ipg_layout_assembly_cond:0 "Enacted #v $law_council_republic$#! or #v $law_single_party_state$#!."
  ipg_layout_bicameral_desc:0 "Dual-chamber parliament displaying the Upper House (Power Structure) on the left and the Lower House (Party Structure or Political Alignment) on the right."
