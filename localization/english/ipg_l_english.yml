  ipg_formula_opt_badge_pr:0 "Proportional (PR)"
  ipg_formula_opt_badge_maj:0 "Majoritarian"
  ipg_formula_reason_manual:0 "Custom apportionment method currently in effect across Party Structure, Power Structure, and Political Alignment."
  ipg_formula_reason_1:0 "Adopts #v Hare / Hamilton#! proportionality in the absence of voting laws."
  ipg_formula_reason_2:0 "Adopts the continental #v D'Hondt#! method under #v $law_landed_voting$#! / #v $law_wealth_voting$#! / #v $law_census_voting$#!."
  ipg_formula_reason_3:0 "Adopts the balanced #v Sainte-Laguë#! method under #v $law_universal_suffrage$#! with #v $law_parliamentary_republic$#! or #v $law_council_republic$#!."
  ipg_formula_reason_4:0 "Adopts #v 5% Threshold PR#! under #v $law_universal_suffrage$#! to limit parliamentary fragmentation."
  ipg_formula_reason_5:0 "Adopts #v Plurality (FPTP)#! following #v $heritage_british$ / $language_anglophone$#! constituency traditions."
  ipg_formula_auto_desc:0 "Adapts the seat apportionment method automatically to your $lawgroup_distribution_of_power$ law and constitutional heritage."
  ipg_formula_auto_cond:0 "• #v No voting law#!: Hare / Hamilton\n• #v $heritage_british$ / $language_anglophone$#! (with voting law): Plurality (FPTP)\n• #v $law_universal_suffrage$#! (#v $law_parliamentary_republic$ / $law_council_republic$#!): Sainte-Laguë\n• #v $law_universal_suffrage$#! (other): 5% Threshold PR\n• #v $law_landed_voting$ / $law_wealth_voting$ / $law_census_voting$#! (other): D'Hondt"
  ipg_formula_1_desc:0 "Largest-remainder method (Hare quota). Awards strictly proportional seats with leftover seats going to the highest fractional remainders. Chamber size: #v standard (100%)#!."
  ipg_formula_1_cond:0 "Enacted under non-electoral systems (#v $law_autocracy$#!, #v $law_oligarchy$#!, #v $law_technocracy$#!, #v $law_single_party_state$#!)."
  ipg_formula_2_desc:0 "Highest-average method using divisors 1, 2, 3, 4… Widely used across Europe; mildly favors larger parties and stable coalitions. Chamber size: #v -5%#! (compact continental list)."
  ipg_formula_2_cond:0 "Non-$language_anglophone$ nations under #v $law_landed_voting$#!, #v $law_wealth_voting$#!, or #v $law_census_voting$#!."
  ipg_formula_3_desc:0 "Highest-average method using odd divisors 1, 3, 5, 7… Standard in Scandinavia & Germany; unbiased between large and smaller parties. Chamber size: #v +10%#! (leveling seats)."
  ipg_formula_3_cond:0 "#v $law_universal_suffrage$#! combined with #v $law_parliamentary_republic$#! or #v $law_council_republic$#!."
  ipg_formula_4_desc:0 "Proportional representation with a #v 5%#! parliamentary hurdle. Factions below 5% win no seats, consolidating the chamber. Chamber size: #v -15%#! (streamlined)."
  ipg_formula_4_cond:0 "#v $law_universal_suffrage$#! under a #v $law_presidential_republic$#! or #v $law_monarchy$#!."
  ipg_formula_5_desc:0 "Single-member constituency winner's bonus rewarding leading parties with stronger governing majorities while preserving opposition representation. Chamber size: #v +25%#! (local constituency MPs)."
  ipg_formula_5_cond:0 "#v $heritage_british$#! or #v $language_anglophone$#! primary cultures with any voting law."
