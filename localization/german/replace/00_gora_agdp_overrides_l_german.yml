l_german:
 # GORA UI+ — Advanced GDP Tracker: vanilla tooltip overrides
 # Adds GDP-growth, LARP fractions and per-state GDP breakdowns to vanilla
 # tooltips. Verified against vanilla 1.13.4 keys (RADICALS_TOOLTIP,
 # LOYALISTS_TOOLTIP, NEUTRALS_TOOLTIP, POP_TOOLTIP, GDP_TOOLTIP,
 # CURRENT_GDP_STATE).

 # ─── LARP-extended population & GDP tooltips ────────────────────────────
 RADICALS_TOOLTIP:1 "#tooltip_header $RADICALS$#!\nEs gibt #v [Country.GetNumRadicals|D]#! ([Country.MakeScope.ScriptValue('larp_radicals_percent')|%v1]) $RADICALS$ bei einer Gesamtbevölkerung von #v [Country.GetTotalPopulation|D]#! [Country.GetAltName('IN')]\n$TOOLTIP_DELIMITER$\nDie Anzahl an Radikalen ändert sich um #v #tooltippable #tooltip:[Country.GetTooltipTag],RADICALS_CHANGE_TOOLTIP [Country.GetTotalNumRadicalsChange|D=-]#!#!#! seit [Country.GetRadicalsLoyalistsChangeStartDate|v].\nDie ausschlaggebendsten Faktoren sind [Country.GetRadicalsChangeSummary]\n\n[Country.GetRadicalsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization(GreaterThan_int32(Country.CalcNumStatesInTurmoil, '(int32)0'), 'STATES_IN_TURMOIL', ''))][ConcatIfNeitherEmpty('\n\n',SelectLocalization(Country.HasIGApprovalFromRadicals, 'RADICALS_IG_APPROVAL', ''))]"

 LOYALISTS_TOOLTIP:1 "#tooltip_header $LOYALISTS$#!\nEs gibt #v [Country.GetNumLoyalists|D]#! ([Country.MakeScope.ScriptValue('larp_loyalists_percent')|%v1]) $LOYALISTS$ bei einer Gesamtbevölkerung von #v [Country.GetTotalPopulation|D]#! [Country.GetAltName('IN')]\n$TOOLTIP_DELIMITER$\nDie Anzahl an Loyalisten ändert sich um #v #tooltippable #tooltip:[Country.GetTooltipTag],LOYALISTS_CHANGE_TOOLTIP [Country.GetTotalNumLoyalistsChange|D=+]#!#!#! seit [Country.GetRadicalsLoyalistsChangeStartDate|v].\nDie ausschlaggebendsten Faktoren sind [Country.GetLoyalistsChangeSummary]\n\n[Country.GetLoyalistsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromLoyalists, 'LOYALISTS_IG_APPROVAL', '' ))]"

 NEUTRALS_TOOLTIP: "#tooltip_header $NEUTRALS$#!\nEs gibt #v [Country.GetNumNeutrals|*2]#! ([Country.MakeScope.ScriptValue('larp_neutrals_percent')|%v1]) $NEUTRALS$ bei einer Gesamtbevölkerung von #v [Country.GetTotalPopulation|*2]#! [Country.GetAltName('IN')]"

 POP_TOOLTIP:2 "#tooltip_header [Concept('concept_pop','$concept_population$')]#!\nDerzeit: [Country.GetTotalPopulation|*2v] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$\n$TOOLTIP_DELIMITER$\nDie [Country.GetAdjective] Bevölkerung macht [Country.MakeScope.ScriptValue('larp_global_pop_percent')|%v1] der Weltbevölkerung aus\nWeltbevölkerung: [Country.MakeScope.ScriptValue('larp_global_pop')|*2v]"

 GDP_TOOLTIP:1 "#header [Country.GetAdjective|U]es [concept_gdp]#!\n@money![Country.GetGDP|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) $concept_gdp_short$ im inländischen Besitz ([Country.GetGDPRanking])\n@money![Country.GetGDPPerCapita|2*v] [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')] ([Country.GetGDPPerCapitaRanking])\n$GDPGR_growth_text$\n$TOOLTIP_DELIMITER$\nDas [Country.GetAdjective] $concept_gdp_short$ macht [Country.MakeScope.ScriptValue('larp_global_gdp_percent')|%v2] des Welt-BIP aus\nWelt-BIP: @money![Country.MakeScope.ScriptValue('larp_global_gdp')|Dv]"

 # ─── Per-state GDP breakdown ────────────────────────────────────────────
 CURRENT_GDP_STATE:2 "#header [State.GetOwner.GetAdjectiveNoFormatting]es [concept_gdp] aus [State.GetName]#!\n$TOOLTIP_DELIMITER$\nDerzeitiger jährlicher BIP-Beitrag: #variable @money![State.GetGDPContribution|K]#!\nBIP pro Kopf von [State.GetName]: #variable @money![State.MakeScope.ScriptValue('get_state_gdp_per')|Dv]#!\nAbweichung des Pro-Kopf-BIP von [State.GetName] zu [State.GetOwner.GetAdjectiveNoFormatting]: #variable @money![State.MakeScope.ScriptValue('get_country_state_relative_value')|D2+=]#!\nAbweichung des Pro-Kopf-BIP von [State.GetName] zum globalen Durchschnitt: #variable @money![State.MakeScope.ScriptValue('get_global_state_relative_value')|D2+=]#!\n[State.GetName] trägt #variable [State.GetGDPContributionPercentage|%1]#! des [State.GetOwner.GetAdjectiveNoFormatting]en $GDP_SHORT$ bei\n\n[State.GetGDPGoodsContributionBreakdown]"
