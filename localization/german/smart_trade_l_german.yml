 SMART_TRADE_TREATIES_TT:0 "#header Nettoeinnahmen aus Verträgen#!\nGesendete Waren: @money![Subtract_CFixedPoint(Subtract_CFixedPoint(GetPlayer.PredictTreatyIncome, GetPlayer.PredictTreatyExpenses), GetPlayer.MakeScope.ScriptValue('st_player_treaty_money'))|D+=]\nKosten der Schifffahrtswege: @money![Negate_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('st_player_lane_units'), GetGoods('merchant_marine').WithMarketContext(GetPlayer.GetMarket.Self).GetMarketPrice))|D+=] (Schätzung)\nGeldübereignungen: @money![GetPlayer.MakeScope.ScriptValue('st_player_treaty_money')|D+=]\nDer Transport wird in Handelsmarine zu Ihrem Marktpreis bezahlt; mehr Häfen senken ihn.\nDetails in der Vertragsliste der Pinnwand."
 st_treaty_article_losing_group:0 "(ST) Warenübereignung mit Verlust"
 notification_st_treaty_article_losing_name:0 "[SCOPE.sGoods('st_tna_goods').GetName] an [SCOPE.sC('st_tna_partner').GetNameNoFormatting] macht Verlust"
 notification_st_treaty_article_losing_desc:0 "[SCOPE.sGoods('st_tna_goods').GetName] an [SCOPE.sC('st_tna_partner').GetNameNoFormatting] zu senden macht seit 6 Monaten in Folge Verlust: derzeit etwa @money![SCOPE.GetValue('st_tna_loss')|0] pro Woche. Verhandeln Sie den Vertrag neu, um diese Ware zu streichen, oder kündigen Sie ihn."
 notification_st_treaty_article_losing_tooltip:0 "#header $notification_st_treaty_article_losing_name$#!\n$TOOLTIP_DELIMITER$\n$notification_st_treaty_article_losing_desc$"
 ST_REC_HEADER:0 "(ST) Vorgeschlagene Warenübereignungen"
 ST_REC_HEADER_TT:0 "Die 5 profitabelsten Warenübereignungen, die Sie jetzt vorschlagen könnten, jeden Monat neu berechnet: wöchentlicher Gewinn, geschätzt zu den Preisen der ersten Woche, bei der besten Menge, die der Partner voll akzeptiert.\nNur gewinnbringende Übereignungen, Waren, von denen Ihr Markt mindestens 10 übrig hat, und Partner, mit denen Sie nicht im Krieg sind.\nIn Klammern: die Grundakzeptanz des Partners vor jedem Artikel (Details beim Überfahren). Partner unter 0 werden ausgelassen, sobald ihr Wert bekannt ist, ab ihrem ersten Monat."
 ST_REC_REFRESH_TT:0 "Vorschläge jetzt neu berechnen."
 ST_REC_NONE:0 "Derzeit wäre keine Warenübereignung gewinnbringend."
 ST_REC_PENDING:0 "Wird zum Monatswechsel berechnet. Drücken Sie die Aktualisieren-Schaltfläche, um jetzt zu berechnen."
 ST_REC_TREATY_TT:0 "Einen Vertrag mit diesem Land öffnen."
 ST_REC_ACC_TT:0 "#header Grundakzeptanz: [Country.GetNameNoFormatting]#!\n[Country.MakeScope.GetScriptValueDesc('st_rec_acc')]"
 ST_REC_ONE_HEADER:0 "(ST) Beste Partner für diese Ware"
 ST_REC_ONE_HEADER_TT:0 "Die 3 profitabelsten Länder, an die Sie diese Ware per Warenübereignung senden können, berechnet beim Öffnen dieses Fensters: wöchentlicher Gewinn zu den Preisen der ersten Woche, bei der besten Menge, die der Partner voll akzeptiert. In Klammern: die Grundakzeptanz des Partners vor jedem Artikel (Details beim Überfahren); Partner unter 0 werden ausgelassen."
 ST_REC_ONE_PENDING:0 "Suche nach Partnern..."
 ST_REC_ONE_NONE:0 "Derzeit würde kein Partner für diese Ware zahlen. Eine Warenübereignung braucht mindestens 10 Überschuss in Ihrem Markt."
