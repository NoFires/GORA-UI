 SMART_TRADE_MAX_SEND_TT:0 "Setzt die Menge auf [Max_CFixedPoint('(CFixedPoint)10', Min_CFixedPoint(Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10')), Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)))|0]: deckt die Knappheit von [ArticleDraft.GetSecondOrTarget.GetNameNoFormatting], ohne Ihren Überschuss zu überschreiten."
 SMART_TRADE_ACCEPT_SEND_TT:0 "Setzt die Menge auf die höchste Akzeptanz, mit dem besten Gewinn oder dem kleinsten Verlust."
 SMART_TRADE_MAX_RECV_TT:0 "Setzt die Menge auf [Max_CFixedPoint('(CFixedPoint)10', Min_CFixedPoint(Max_CFixedPoint('(CFixedPoint)10', Add_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)0.3', Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketSellOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetFirstOrSource.GetMarket.Self).GetMarketBuyOrders)), '(CFixedPoint)10')), Add_CFixedPoint(Subtract_CFixedPoint(ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketBuyOrders, ArticleDraft.GetGoods.WithMarketContext(ArticleDraft.GetSecondOrTarget.GetMarket.Self).GetMarketSellOrders), '(CFixedPoint)10')))|0]: deckt Ihre Knappheit, ohne mehr zu verlangen, als [ArticleDraft.GetFirstOrSource.GetNameNoFormatting] entbehren kann."
