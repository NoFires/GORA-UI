l_german:
 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! Importiert insgesamt [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0] Waren vom Markt [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! Exportiert insgesamt [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0] Waren in den Markt [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(TradePartnersIsImporterFrom(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(TradePartnersIsExporterTo(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName] exportiert in den Markt [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Menge: [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [Market.GetName] importiert vom Markt [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!Menge: [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Market.GetName] importiert vom Markt [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Menge: [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName] exportiert in den Markt [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!Menge: [TradePartnersGetExportsTo(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "Exportierte Waren:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "Importierte Waren:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "Exportpartner"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "Importpartner"
 TRADE_PARTNERS_TRADE_SURPLUS: "Handelsüberschuss"
 TRADE_PARTNERS_TRADE_DEFICIT: "Handelsdefizit"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]e, die Waren aus [Market.GetName] über den [concept_world_market] importieren, geordnet nach Anteil an den [Concept('concept_trade','$concept_exports|q$')].\nBilaterale Werte richten sich nach dem aktuellen [concept_world_market_price]."
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_market]e, die Waren über den [concept_world_market] nach [Market.GetName] exportieren, geordnet nach Anteil an den [Concept('concept_trade','$concept_imports|q$')].\nBilaterale Werte richten sich nach dem aktuellen [concept_world_market_price]."
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "Bewertet zum aktuellen [concept_world_market_price]"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_imports|q$')] aus [Scope.GetMarket.GetName] machen #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! der gesamten [Concept('concept_trade','$concept_imports|q$')] von [Market.GetName] aus\n$TOOLTIP_DELIMITER$\n• Aus diesem Markt: #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• Markt-Gesamt-[Concept('concept_trade','$concept_imports|q$')]: #v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Concept('concept_trade','$concept_exports|q$')] nach [Scope.GetMarket.GetName] machen #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! der gesamten [Concept('concept_trade','$concept_exports|q$')] von [Market.GetName] aus\n$TOOLTIP_DELIMITER$\n• In diesen Markt: #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• Markt-Gesamt-[Concept('concept_trade','$concept_exports|q$')]: #v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nBilaterales Handelsvolumen: @money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] an Partner: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] von Partner: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nMit [Scope.GetMarket.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]wert: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]wert: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Bewertet zum aktuellen [concept_world_market_price]#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateraler Wert: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Handelsmenge: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateraler Wert: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Handelsmenge: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\nMit [Market.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]wert: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]wert: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Bewertet zum aktuellen [concept_world_market_price]#!"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateraler Wert: @money!#v [Multiply_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Handelsmenge: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nBilateraler Wert: @money!#v [Multiply_CFixedPoint(Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Handelsmenge: #v [Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_HEADER_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]"
 TRADE_PARTNERS_HEADER_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]"
 TRADE_PARTNERS_KPI_EXPORTS_LABEL: "@market_exports! [Concept('concept_trade','$concept_exports|q$')]:"
 TRADE_PARTNERS_KPI_IMPORTS_LABEL: "@market_imports! [Concept('concept_trade','$concept_imports|q$')]:"
 TRADE_PARTNERS_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nImportiert aus [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Anteil an [Concept('concept_trade','$concept_imports|q$')] aus diesem Markt: #blue_value [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (von #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!)\n• Anteil an Partner-Exporten von [Goods.GetNameNoFormatting]: #v [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketExports, '(CFixedPoint)1'))|%1]#! (von #v [Goods.GetMarketExports|D]#!)"
 TRADE_PARTNERS_GOODS_EXPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nExportiert nach [Scope.GetMarket.GetName]: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Anteil an [Concept('concept_trade','$concept_exports|q$')] in diesen Markt: #gold_value [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (von #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!)\n• Anteil an Partner-Importen von [Goods.GetNameNoFormatting]: #v [Divide_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (von #v [Goods.GetMarketImports|D]#!)"
