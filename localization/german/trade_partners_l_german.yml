 TRADE_PARTNERS_OTHER_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nExportiert nach [Market.GetName]: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Anteil an [Concept('concept_trade','$concept_exports|q$')] in diesen Markt: #gold_value [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), '(CFixedPoint)1'))|%1]#! (von #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!)\n• Anteil an Partner-Importen von [Goods.GetNameNoFormatting]: #v [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (von #v [Goods.GetMarketImports|D]#!)"
