  ipg_formula_2_cond:0 "Nações não-$language_anglophone$ sob #v $law_landed_voting$#!, #v $law_wealth_voting$#! ou #v $law_census_voting$#!."
  ipg_formula_3_desc:0 "Divisores ímpares (1, 3, 5, 7…). Padrão nórdico equilibrado entre partidos grandes e menores.\nTamanho da câmara: #v +10%#! (assentos de nivelamento)."
