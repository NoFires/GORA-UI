 TRADE_PARTNERS_OTHER_BAR_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting]#!\nComércio Bilateral Total: @money!#v [Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] ao parceiro: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] do parceiro: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\nExportado para [Market.GetName]: #v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Participação nas [Concept('concept_trade','$concept_exports|q$')] para este mercado: #gold_value [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket), '(CFixedPoint)1'))|%1]#! (de #v [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|0D]#!)\n• Participação nas importações de [Goods.GetNameNoFormatting] do parceiro: #v [Divide_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketImports, '(CFixedPoint)1'))|%1]#! (de #v [Goods.GetMarketImports|D]#!)"
