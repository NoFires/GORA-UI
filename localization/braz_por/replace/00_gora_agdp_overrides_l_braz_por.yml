l_braz_por:
 # GORA UI+ — Advanced GDP Tracker: vanilla tooltip overrides
 # Adds GDP-growth, LARP fractions and per-state GDP breakdowns to vanilla
 # tooltips. Verified against vanilla 1.13.4 keys (RADICALS_TOOLTIP,
 # LOYALISTS_TOOLTIP, NEUTRALS_TOOLTIP, POP_TOOLTIP, GDP_TOOLTIP,
 # CURRENT_GDP_STATE).

 # ─── LARP-extended population & GDP tooltips ────────────────────────────
 RADICALS_TOOLTIP:1 "#tooltip_header $RADICALS$#!\nHá #v [Country.GetNumRadicals|D]#! ([Country.MakeScope.ScriptValue('larp_radicals_percent')|%v1]) $RADICALS$ na população total de #v [Country.GetTotalPopulation|D]#! no país [Country.GetName]\n$TOOLTIP_DELIMITER$\nO número de $RADICALS$ mudou em #v #tooltippable #tooltip:[Country.GetTooltipTag],RADICALS_CHANGE_TOOLTIP [Country.GetTotalNumRadicalsChange|D=-]#!#!#! desde [Country.GetRadicalsLoyalistsChangeStartDate|v].\nOs fatores mais impactantes são [Country.GetRadicalsChangeSummary]\n\n[Country.GetRadicalsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( GreaterThan_int32(Country.CalcNumStatesInTurmoil, '(int32)0'), 'STATES_IN_TURMOIL', '' ))][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromRadicals, 'RADICALS_IG_APPROVAL', '' ))]"

 LOYALISTS_TOOLTIP:1 "#tooltip_header $LOYALISTS$#!\nHá #v [Country.GetNumLoyalists|D]#! ([Country.MakeScope.ScriptValue('larp_loyalists_percent')|%v1]) $LOYALISTS$ na população total de #v [Country.GetTotalPopulation|D]#! no país [Country.GetName]\n$TOOLTIP_DELIMITER$\nO número de $LOYALISTS$ mudou em #v #tooltippable #tooltip:[Country.GetTooltipTag],LOYALISTS_CHANGE_TOOLTIP [Country.GetTotalNumLoyalistsChange|D=+]#!#!#! desde [Country.GetRadicalsLoyalistsChangeStartDate|v]\nOs fatores mais impactantes são [Country.GetLoyalistsChangeSummary]\n\n[Country.GetLoyalistsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromLoyalists, 'LOYALISTS_IG_APPROVAL', '' ))]"

 NEUTRALS_TOOLTIP: "#tooltip_header $NEUTRALS$#!\nHá #v [Country.GetNumNeutrals|*2]#! ([Country.MakeScope.ScriptValue('larp_neutrals_percent')|%v1]) $NEUTRALS$ na população total de #v [Country.GetTotalPopulation|*2]#! no país [Country.GetName]"

 POP_TOOLTIP:2 "#tooltip_header [Concept('concept_pop', '$concept_population$')]#!\nAtual: [Country.GetTotalPopulation|*2v] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$\n$TOOLTIP_DELIMITER$\nA população [Country.GetAdjective] representa [Country.MakeScope.ScriptValue('larp_global_pop_percent')|%v1] da população mundial\nPopulação mundial: [Country.MakeScope.ScriptValue('larp_global_pop')|*2v]"

 GDP_TOOLTIP:1 "#header [concept_gdp] [Country.GetAdjective]#!\n@money![Country.GetGDP|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) de $concept_gdp_short$ de propriedade doméstica ([Country.GetGDPRanking])\n@money![Country.GetGDPPerCapita|2*v] de [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')] ([Country.GetGDPPerCapitaRanking])\n$GDPGR_growth_text$\n$TOOLTIP_DELIMITER$\nO $concept_gdp_short$ [Country.GetAdjective] representa [Country.MakeScope.ScriptValue('larp_global_gdp_percent')|%v2] do PIB mundial\nPIB mundial: @money![Country.MakeScope.ScriptValue('larp_global_gdp')|Dv]"

 # ─── Per-state GDP breakdown ────────────────────────────────────────────
 CURRENT_GDP_STATE:2 "#header [concept_gdp] [State.GetOwner.GetAdjectiveNoFormatting] de [State.GetName]#!\n$TOOLTIP_DELIMITER$\nContribuição do PIB anual atual: #variable @money![State.GetGDPContribution|K]#!\nPIB per capita de [State.GetName]: #variable @money![State.MakeScope.ScriptValue('get_state_gdp_per')|Dv]#!\nDiferença de PIB per capita entre [State.GetName] e [State.GetOwner.GetAdjectiveNoFormatting]: #variable @money![State.MakeScope.ScriptValue('get_country_state_relative_value')|D2+=]#!\nDiferença de PIB per capita entre [State.GetName] e a média mundial: #variable @money![State.MakeScope.ScriptValue('get_global_state_relative_value')|D2+=]#!\n[State.GetName] está contribuindo com #variable [State.GetGDPContributionPercentage|%1]#! do $GDP_SHORT$ [State.GetOwner.GetAdjectiveNoFormatting]\n\n[State.GetGDPGoodsContributionBreakdown]"
