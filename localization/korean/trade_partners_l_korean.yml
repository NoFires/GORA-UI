 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! 수입 중 [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0] 전체 상품을 [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]"
