 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName] 에서 수출 중인 [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!수량: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [Market.GetName] 에서 수입 중인 [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]\n#!#!수량: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Market.GetName] 에서 수입 중인 [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!수량: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName] 에서 수출 중인 [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]\n#!#!수량: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "수출 상대:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "수입 상대:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "주요 수출국"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "주요 수입국"
 TRADE_PARTNERS_TRADE_SURPLUS: "무역 흑자"
 TRADE_PARTNERS_TRADE_DEFICIT: "무역 적자"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_world_market]을 통해 [Market.GetName]에서 상품을 수입하는 각 [concept_market]을 [Concept('concept_trade','$concept_exports|q$')]량 비중순으로 표시합니다.\n양자 무역액은 현재 [concept_world_market_price] 기준으로 산정됩니다."
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_world_market]을 통해 [Market.GetName]으로 상품을 수출하는 각 [concept_market]을 [Concept('concept_trade','$concept_imports|q$')]량 비중순으로 표시합니다.\n양자 무역액은 현재 [concept_world_market_price] 기준으로 산정됩니다."
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "현재 [concept_world_market_price] 기준 산정"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Scope.GetMarket.GetName]에서의 [Concept('concept_trade','$concept_imports|q$')]이 [Market.GetName] 전체 [Concept('concept_trade','$concept_imports|q$')]량의 #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#!를 차지합니다\n$TOOLTIP_DELIMITER$\n• 해당 시장에서: #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• 시장 총 [Concept('concept_trade','$concept_imports|q$')]: #v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Scope.GetMarket.GetName]으로의 [Concept('concept_trade','$concept_exports|q$')]이 [Market.GetName] 전체 [Concept('concept_trade','$concept_exports|q$')]량의 #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#!를 차지합니다\n$TOOLTIP_DELIMITER$\n• 해당 시장으로: #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• 시장 총 [Concept('concept_trade','$concept_exports|q$')]: #v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n양자 총 무역액: @money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! 상대 시장 [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! 상대 시장 [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n대 [Scope.GetMarket.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]액: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]액: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore 현재 [concept_world_market_price] 기준#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n양자 무역액: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 거래량: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n양자 무역액: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 거래량: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n대 [Market.GetName]: @money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]액: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]액: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore 현재 [concept_world_market_price] 기준#!"
