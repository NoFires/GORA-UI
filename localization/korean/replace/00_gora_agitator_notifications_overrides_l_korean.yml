l_korean:
 # GORA UI+ — Override vanilla notification descriptions to include character details
 # (interest group, ideology, traits). Uses helper fragments from
 # `localization/english/00_gora_agitator_notifications_l_english.yml`.
 # Keys verified against vanilla 1.13.4:
 #   character_interactions_l_english.yml:40  — notification_exile_notification_desc
 #   interfaces_l_english.yml:7544            — notification_agitator_spawned_desc
 #   interfaces_l_english.yml:7580            — notification_heir_born_notification_desc
 #   interfaces_l_english.yml:10514           — notification_new_ruler_desc
 # File lives in localization/english/replace/ so it overrides the vanilla string.

 notification_exile_notification_desc: "[SCOPE.sCharacter('exile_scope').GetFullName](이)가 [SCOPE.sCountry('exiling_country_scope').GetName]에 의해 [concept_exile] 상태가 되었습니다.\n$gora_dan_agitator_interest_group$\n$gora_dan_agitator_ideology$\n$gora_dan_agitator_traits$"

 notification_new_ruler_desc: "[concept_ruler] [SCOPE.sCharacter( 'previous' ).GetFullName]의 시대는 끝났다. 이제 [SCOPE.GetRootScope.GetCharacter.GetFullName](이)가 새로운 [SCOPE.GetRootScope.GetCharacter.GetCountry.GetName]의 [Concept('concept_ruler', SCOPE.GetRootScope.GetCharacter.GetPrimaryRoleTitle)](이)다.\n$gora_dan_ruler_interest_group$\n$gora_dan_ruler_ideology$\n$gora_dan_ruler_traits$"

 notification_heir_born_notification_desc:0 "[SCOPE.GetRootScope.GetCharacter.GetCountry.GetName] 제위 [concept_heir]인 [SCOPE.GetRootScope.GetCharacter.GetFullName](이)가 탄생했습니다.\n$gora_dan_ruler_interest_group$\n$gora_dan_ruler_ideology$\n$gora_dan_ruler_traits$"

 notification_agitator_spawned_desc:1 "[SCOPE.sCha('character').GetAgitatorSpawnedNotificationText]\n$gora_dan_spawn_interest_group$\n$gora_dan_spawn_ideology$\n$gora_dan_spawn_traits$"
