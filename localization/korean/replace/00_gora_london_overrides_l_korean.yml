l_korean:
 # GORA UI+ — Conference of London journal-entry overhaul
 # Adds GP flag icons + per-proposal vote breakdowns to the vanilla journal
 # entry. Verified against vanilla 1.13.4 key `je_conference_of_london_reason`.

 je_conference_of_london_reason: "열강이 네덜란드와 벨기에 사이의 풀리지 않은 국경 문제를 해결하고자 런던으로 대표단을 보냈습니다. \n\n#variable [GetGlobalVariable( 'je_conference_of_london_participants_var' ).GetValue]#! [Concept('concept_great_power', '$concept_great_powers$')]들이 회의에 참여합니다.\n#bold #tooltippable #tooltip:favour_belgium_button_desc $favour_belgium_button$#!#!#!가 총 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_1' ).GetValue]#! [concept_prestige][ROOT.GetCountry.GetCustom('tlcm_gbr_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_fra_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_rus_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_aus_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_pru_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_spa_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_usa_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_tur_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_jap_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_ita_favours_belgium')][ROOT.GetCountry.GetCustom('tlcm_other_favours_belgium')]의 지지를 받음\n#bold #tooltippable #tooltip:favour_netherlands_button_desc $favour_netherlands_button$#!#!#!가 총 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_2' ).GetValue]#! [concept_prestige][ROOT.GetCountry.GetCustom('tlcm_gbr_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_fra_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_rus_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_aus_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_pru_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_spa_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_usa_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_tur_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_jap_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_ita_favours_netherlands')][ROOT.GetCountry.GetCustom('tlcm_other_favours_netherlands')]의 지지를 받음\n#bold #tooltippable #tooltip:partition_compromise_button_desc $partition_compromise_button$#!#!#!가 총 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_3' ).GetValue]#! [concept_prestige][ROOT.GetCountry.GetCustom('tlcm_gbr_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_fra_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_rus_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_aus_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_pru_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_spa_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_usa_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_tur_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_jap_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_ita_partition_compromise')][ROOT.GetCountry.GetCustom('tlcm_other_partition_compromise')]의 지지를 받음\n#bold #tooltippable #tooltip:luxembourg_compromise_button_desc $luxembourg_compromise_button$#!#!#!가 총 #variable [GetGlobalVariable( 'je_conference_of_london_proposal_4' ).GetValue]#! [concept_prestige][ROOT.GetCountry.GetCustom('tlcm_gbr_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_fra_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_rus_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_aus_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_pru_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_spa_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_usa_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_tur_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_jap_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_ita_luxembourg_compromise')][ROOT.GetCountry.GetCustom('tlcm_other_luxembourg_compromise')]의 지지를 받음\n\n회의는 #variable [GetGlobalVariable('je_conference_of_london_timer').GetValue]#!달 내로 결론이 납니다. 가장 많은 위신의 #tooltippable #tooltip:london_treaty_voting_rules 지지#!#!를 받는 제안이 회의의 공식 해결책으로 결정됩니다.\n\n#Bold 결과#!\n회의는 [ROOT.GetCountry.GetCustom('treaty_of_london_coutcome')][ROOT.GetCountry.GetCustom('treaty_of_london_acceptance_timer')]"

 # Per-power flag-icon line fragments referenced by the customizable_localization
 # `tlcm_*_favours_*` entries (defined in customizable_localization/tlcm_custom_loc.txt).
 # Each line resolves both the flag icon AND the display name dynamically
 # from the saved global ref. Using GetNameNoFormatting (vs. the static
 # `$TAG$` locale key) means formed countries (DEU after unification, ITA
 # after Sardinia formation) show their current name correctly, and no
 # missing-locale-key warnings ever fire.
 tlcm_gbr_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_gbr').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_gbr').GetCountry.GetNameNoFormatting]#!"
 tlcm_fra_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_fra').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_fra').GetCountry.GetNameNoFormatting]#!"
 tlcm_rus_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_rus').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_rus').GetCountry.GetNameNoFormatting]#!"
 tlcm_aus_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_aus').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_aus').GetCountry.GetNameNoFormatting]#!"
 tlcm_pru_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_pru').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_pru').GetCountry.GetNameNoFormatting]#!"
 tlcm_spa_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_spa').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_spa').GetCountry.GetNameNoFormatting]#!"
 tlcm_usa_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_usa').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_usa').GetCountry.GetNameNoFormatting]#!"
 tlcm_tur_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_tur').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_tur').GetCountry.GetNameNoFormatting]#!"
 tlcm_jap_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_jap').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_jap').GetCountry.GetNameNoFormatting]#!"
 tlcm_ita_favour_loc: "\n  [GetGlobalVariable('tlcm_ref_ita').GetCountry.GetFlagTextIcon] #bold [GetGlobalVariable('tlcm_ref_ita').GetCountry.GetNameNoFormatting]#!"
 # DEU (Germany) intentionally omitted — see common/scripted_effects/gora_london_effects.txt comment.
 tlcm_other_favour_loc: "\n  기타 열강"
 tlcm_no_loc: ""
