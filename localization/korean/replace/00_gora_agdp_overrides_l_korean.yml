l_korean:
 # GORA UI+ — Advanced GDP Tracker: vanilla tooltip overrides
 # Adds GDP-growth, LARP fractions and per-state GDP breakdowns to vanilla
 # tooltips. Verified against vanilla 1.13.4 keys (RADICALS_TOOLTIP,
 # LOYALISTS_TOOLTIP, NEUTRALS_TOOLTIP, POP_TOOLTIP, GDP_TOOLTIP,
 # CURRENT_GDP_STATE).

 # ─── LARP-extended population & GDP tooltips ────────────────────────────
 RADICALS_TOOLTIP:1 "#tooltip_header $RADICALS$#!\n[Country.GetName] 내 총 #v [Country.GetTotalPopulation|D]#!명의 인구 중 #v [Country.GetNumRadicals|D]#! ([Country.MakeScope.ScriptValue('larp_radicals_percent')|%v1])명의 $RADICALS$가 존재합니다.\n$TOOLTIP_DELIMITER$\n[Country.GetRadicalsLoyalistsChangeStartDate|v] 이후로 $RADICALS$의 수는 #v #tooltippable #tooltip:[Country.GetTooltipTag],RADICALS_CHANGE_TOOLTIP [Country.GetTotalNumRadicalsChange|D=-]#!#!#!만큼 변화했습니다.\n가장 영향이 큰 요인: [Country.GetRadicalsChangeSummary]\n\n[Country.GetRadicalsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( GreaterThan_int32(Country.CalcNumStatesInTurmoil, '(int32)0'), 'STATES_IN_TURMOIL', '' ))][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromRadicals, 'RADICALS_IG_APPROVAL', '' ))]"

 LOYALISTS_TOOLTIP:1 "#tooltip_header $LOYALISTS$#!\n[Country.GetName] 내 총 #v [Country.GetTotalPopulation|D]#!명의 인구 중 #v [Country.GetNumLoyalists|D]#! ([Country.MakeScope.ScriptValue('larp_loyalists_percent')|%v1])명의 $LOYALISTS$가 존재합니다.\n$TOOLTIP_DELIMITER$\n[Country.GetRadicalsLoyalistsChangeStartDate|v]\n 이후로 $LOYALISTS$의 수는 #v #tooltippable #tooltip:[Country.GetTooltipTag],LOYALISTS_CHANGE_TOOLTIP [Country.GetTotalNumLoyalistsChange|D=+]#!#!#!만큼 변화했습니다.\n가장 영향이 큰 요인: [Country.GetLoyalistsChangeSummary]\n\n[Country.GetLoyalistsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromLoyalists, 'LOYALISTS_IG_APPROVAL', '' ))]"

 NEUTRALS_TOOLTIP: "#tooltip_header $NEUTRALS$#!\n[Country.GetName] 내 총 인원 #v [Country.GetTotalPopulation|*2]#! 중 $NEUTRALS$ #v [Country.GetNumNeutrals|*2]#! ([Country.MakeScope.ScriptValue('larp_neutrals_percent')|%v1])"

 POP_TOOLTIP:2 "#tooltip_header [Concept('concept_pop','$concept_population$')]#!\n현재: [Country.GetTotalPopulation|*2v] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$\n$TOOLTIP_DELIMITER$\n[Country.GetAdjective] 인구는 세계 인구의 [Country.MakeScope.ScriptValue('larp_global_pop_percent')|%v1]\n세계 인구: [Country.MakeScope.ScriptValue('larp_global_pop')|*2v]"

 GDP_TOOLTIP:1 "#header [Country.GetAdjective] [concept_gdp]#!\n@money![Country.GetGDP|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) 국내 소유 $concept_gdp_short$ ([Country.GetGDPRanking])\n@money![Country.GetGDPPerCapita|2*v] [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')] ([Country.GetGDPPerCapitaRanking])\n$GDPGR_growth_text$\n$TOOLTIP_DELIMITER$\n[Country.GetAdjective] $concept_gdp_short$는 세계 GDP의 [Country.MakeScope.ScriptValue('larp_global_gdp_percent')|%v2]\n세계 GDP: @money![Country.MakeScope.ScriptValue('larp_global_gdp')|Dv]"

 # ─── Per-state GDP breakdown ────────────────────────────────────────────
 CURRENT_GDP_STATE:2 "#header [State.GetName]에서 [State.GetOwner.GetAdjectiveNoFormatting]의 [concept_gdp]#!\n$TOOLTIP_DELIMITER$\n현재 연간 국내총생산 공헌: #variable @money![State.GetGDPContribution|K]#!\n[State.GetName]의 1인당 GDP: #variable @money![State.MakeScope.ScriptValue('get_state_gdp_per')|Dv]#!\n[State.GetName]의 1인당 GDP 차이 ([State.GetOwner.GetAdjectiveNoFormatting] 대비): #variable @money![State.MakeScope.ScriptValue('get_country_state_relative_value')|D2+=]#!\n[State.GetName]의 1인당 GDP 차이 (세계 평균 대비): #variable @money![State.MakeScope.ScriptValue('get_global_state_relative_value')|D2+=]#!\n[State.GetName](은)는 [State.GetOwner.GetAdjectiveNoFormatting]의 $GDP_SHORT$에서 #variable [State.GetGDPContributionPercentage|%1]#!만큼 공헌하고 있음\n\n[State.GetGDPGoodsContributionBreakdown]"
