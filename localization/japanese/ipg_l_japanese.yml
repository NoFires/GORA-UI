  ipg_formula_reason_1:0 "投票法が存在しないため、#v ヘア・ハミルトン式#! による純比例配分を採用しています。"
  ipg_formula_reason_2:0 "#v $law_landed_voting$#! / #v $law_wealth_voting$#! / #v $law_census_voting$#! に基づき欧州主流の #v ドント式#! を採用しています。"
  ipg_formula_reason_3:0 "#v $law_parliamentary_republic$#! または #v $law_council_republic$#! の #v $law_universal_suffrage$#! により #v サン＝ラグ式#! を採用しています。"
