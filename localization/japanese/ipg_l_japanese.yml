  ipg_formula_reason_5:0 "#v $heritage_british$ / $language_anglophone$#! の小選挙区伝統により #v 小選挙区制#! を採用しています。"
  ipg_formula_auto_desc:0 "$lawgroup_distribution_of_power$法と憲政伝統に応じて歴史的な議席配分制度を適用します。"
  ipg_formula_auto_cond:0 "• #v 投票法なし#!：ヘア・ハミルトン式\n• #v $heritage_british$ / $language_anglophone$#!（投票法あり）：小選挙区制\n• #v $law_universal_suffrage$#!（#v $law_parliamentary_republic$ / $law_council_republic$#!）：サン＝ラグ式\n• #v $law_universal_suffrage$#!（その他）：5% 阻止条項\n• #v $law_landed_voting$ / $law_wealth_voting$ / $law_census_voting$#!（その他）：ドント式"
  ipg_formula_1_desc:0 "最大剰余法による厳密な比例配分です。議会規模：#v 標準（100%）#!。"
  ipg_formula_1_cond:0 "非選挙体制（#v $law_autocracy$#!・#v $law_oligarchy$#!・#v $law_technocracy$#!・#v $law_single_party_state$#! 等）。"
  ipg_formula_2_desc:0 "除数 1, 2, 3, 4… の最高平均方式。大政党と連立安定をやや優遇します。議会規模：#v -5%#!。"
  ipg_formula_2_cond:0 "非$language_anglophone$諸国の #v $law_landed_voting$#!・#v $law_wealth_voting$#!・#v $law_census_voting$#!。"
  ipg_formula_3_desc:0 "奇数除数 1, 3, 5, 7… の均衡比例代表制。北欧・独の標準方式です。議会規模：#v +10%#!（調整議席）。"
  ipg_formula_3_cond:0 "#v $law_parliamentary_republic$#! または #v $law_council_republic$#! 下の #v $law_universal_suffrage$#!。"
  ipg_formula_4_desc:0 "#v 5%#! 未満の小党を議席配分から除外し議会を集約します。議会規模：#v -15%#!。"
  ipg_formula_4_cond:0 "#v $law_presidential_republic$#! または #v $law_monarchy$#! 下の #v $law_universal_suffrage$#!。"
  ipg_formula_5_desc:0 "英米型の小選挙区多数ボーナスを再現し第一党の優位を拡大します。議会規模：#v +25%#!（選挙区定数増）。"
