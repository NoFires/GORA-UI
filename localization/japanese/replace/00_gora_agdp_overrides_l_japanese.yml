l_japanese:
 # GORA UI+ — Advanced GDP Tracker: vanilla tooltip overrides
 # Adds GDP-growth, LARP fractions and per-state GDP breakdowns to vanilla
 # tooltips. Verified against vanilla 1.13.4 keys (RADICALS_TOOLTIP,
 # LOYALISTS_TOOLTIP, NEUTRALS_TOOLTIP, POP_TOOLTIP, GDP_TOOLTIP,
 # CURRENT_GDP_STATE).

 # ─── LARP-extended population & GDP tooltips ────────────────────────────
 RADICALS_TOOLTIP:1 "#tooltip_header $RADICALS$#!\n[Country.GetName]の総人口#v [Country.GetTotalPopulation|D]#!の中に#v [Country.GetNumRadicals|D]#! ([Country.MakeScope.ScriptValue('larp_radicals_percent')|%v1])人の$RADICALS$がいます。\n$TOOLTIP_DELIMITER$\n$RADICALS$の数は、[Country.GetRadicalsLoyalistsChangeStartDate|v]以降の#v #tooltippable #tooltip:[Country.GetTooltipTag],RADICALS_CHANGE_TOOLTIP [Country.GetTotalNumRadicalsChange|D=-]#!#!#!によって変化します。\n最も影響力のある要因は[Country.GetRadicalsChangeSummary]\n\n[Country.GetRadicalsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( GreaterThan_int32(Country.CalcNumStatesInTurmoil, '(int32)0'), 'STATES_IN_TURMOIL', '' ))][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromRadicals, 'RADICALS_IG_APPROVAL', '' ))]です"

 LOYALISTS_TOOLTIP:1 "#tooltip_header $LOYALISTS$#!\n[Country.GetName]の総人口#v [Country.GetTotalPopulation|D]#!の中に#v [Country.GetNumLoyalists|D]#! ([Country.MakeScope.ScriptValue('larp_loyalists_percent')|%v1])人の$LOYALISTS$がいます。\n$TOOLTIP_DELIMITER$\n$LOYALISTS$の数は、[Country.GetRadicalsLoyalistsChangeStartDate|v]以降の#v #tooltippable #tooltip:[Country.GetTooltipTag],LOYALISTS_CHANGE_TOOLTIP [Country.GetTotalNumLoyalistsChange|D=+]#!#!#!によって変化します。\n最も影響力のある要因は[Country.GetLoyalistsChangeSummary]\n\n[Country.GetLoyalistsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromLoyalists, 'LOYALISTS_IG_APPROVAL', '' ))]です"

 NEUTRALS_TOOLTIP: "#tooltip_header $NEUTRALS$#!\n[Country.GetName]の総人口#v [Country.GetTotalPopulation|*2]#!の中に#v [Country.GetNumNeutrals|*2]#! ([Country.MakeScope.ScriptValue('larp_neutrals_percent')|%v1])人の$NEUTRALS$がいます。"

 POP_TOOLTIP:2 "#tooltip_header [Concept('concept_pop','$concept_population$')]#!\n現在: [Country.GetTotalPopulation|*2v] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$\n$TOOLTIP_DELIMITER$\n[Country.GetAdjective]の人口は世界人口の[Country.MakeScope.ScriptValue('larp_global_pop_percent')|%v1]\n世界人口：[Country.MakeScope.ScriptValue('larp_global_pop')|*2v]"

 GDP_TOOLTIP:1 "#header [Country.GetAdjective]の[concept_gdp]#!\n@money! [Country.GetGDP|Dv]（#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!）国内所有の$concept_gdp_short$（[Country.GetGDPRanking]）\n@money! [Country.GetGDPPerCapita|2*v] [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')]（[Country.GetGDPPerCapitaRanking]）\n$GDPGR_growth_text$\n$TOOLTIP_DELIMITER$\n[Country.GetAdjective]の$concept_gdp_short$は世界GDPの[Country.MakeScope.ScriptValue('larp_global_gdp_percent')|%v2]\n世界GDP：@money![Country.MakeScope.ScriptValue('larp_global_gdp')|Dv]"

 # ─── Per-state GDP breakdown ────────────────────────────────────────────
 CURRENT_GDP_STATE:2 "#header [State.GetName]による[State.GetOwner.GetAdjectiveNoFormatting] [concept_gdp]#!\n$TOOLTIP_DELIMITER$\n現在の年間GDP貢献: #variable @money![State.GetGDPContribution|K]#!\n[State.GetName]の一人当たりGDP：#variable @money![State.MakeScope.ScriptValue('get_state_gdp_per')|Dv]#!\n[State.GetName]の一人当たりGDP格差（[State.GetOwner.GetAdjectiveNoFormatting]比）：#variable @money![State.MakeScope.ScriptValue('get_country_state_relative_value')|D2+=]#!\n[State.GetName]の一人当たりGDP格差（世界平均比）：#variable @money![State.MakeScope.ScriptValue('get_global_state_relative_value')|D2+=]#!\n[State.GetName]の貢献度は、[State.GetOwner.GetAdjectiveNoFormatting] $GDP_SHORT$の#variable [State.GetGDPContributionPercentage|%1]#!です\n\n[State.GetGDPGoodsContributionBreakdown]"
