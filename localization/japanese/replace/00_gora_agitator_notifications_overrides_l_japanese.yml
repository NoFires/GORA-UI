l_japanese:
 # GORA UI+ — Override vanilla notification descriptions to include character details
 # (interest group, ideology, traits). Uses helper fragments from
 # `localization/english/00_gora_agitator_notifications_l_english.yml`.
 # Keys verified against vanilla 1.13.4:
 #   character_interactions_l_english.yml:40  — notification_exile_notification_desc
 #   interfaces_l_english.yml:7544            — notification_agitator_spawned_desc
 #   interfaces_l_english.yml:7580            — notification_heir_born_notification_desc
 #   interfaces_l_english.yml:10514           — notification_new_ruler_desc
 # File lives in localization/english/replace/ so it overrides the vanilla string.

 notification_exile_notification_desc: "[SCOPE.sCharacter('exile_scope').GetFullName]が[SCOPE.sCountry('exiling_country_scope').GetName]によって[concept_exile]とされました。\n$gora_dan_agitator_interest_group$\n$gora_dan_agitator_ideology$\n$gora_dan_agitator_traits$"

 notification_new_ruler_desc: "[SCOPE.sCharacter( 'previous' ).GetFullName]が[concept_ruler]であった時代は終わりを告げました。[SCOPE.GetRootScope.GetCharacter.GetFullName]が[SCOPE.GetRootScope.GetCharacter.GetCountry.GetName]の新たな[Concept('concept_ruler', SCOPE.GetRootScope.GetCharacter.GetPrimaryRoleTitle)]です\n$gora_dan_ruler_interest_group$\n$gora_dan_ruler_ideology$\n$gora_dan_ruler_traits$"

 notification_heir_born_notification_desc:0 "[SCOPE.GetRootScope.GetCharacter.GetCountry.GetName]の王位[concept_heir]となる[SCOPE.GetRootScope.GetCharacter.GetFullName]が誕生しました\n$gora_dan_ruler_interest_group$\n$gora_dan_ruler_ideology$\n$gora_dan_ruler_traits$"

 notification_agitator_spawned_desc:1 "[SCOPE.sCha('character').GetAgitatorSpawnedNotificationText]\n$gora_dan_spawn_interest_group$\n$gora_dan_spawn_ideology$\n$gora_dan_spawn_traits$"
