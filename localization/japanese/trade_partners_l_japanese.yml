l_japanese:
 TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT: "@market_imports! [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]から[TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0]輸入"
 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]へ[TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0]輸出"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(TradePartnersIsImporterFrom(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(TradePartnersIsExporterTo(Market, GetPlayer.GetMarket),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName]から[GetPlayer.GetMarket.GetOwner.GetFlagTextIcon][GetPlayer.GetMarket.GetName]への輸出\n#!#!数量: [TradePartnersGetExportsTo(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName]から[Market.GetName]への輸入\n#!#!数量: [TradePartnersGetImportsFrom(Market, GetPlayer.GetMarket)|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]から[Market.GetName]への輸入\n#!#!数量: [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName]から[Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName]への輸出\n#!#!数量: [TradePartnersGetExportsTo(Market, Scope.GetMarket)|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "輸出商品:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "輸入商品:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "輸出パートナー"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "輸入パートナー"
 TRADE_PARTNERS_TRADE_SURPLUS: "貿易黒字"
 TRADE_PARTNERS_TRADE_DEFICIT: "貿易赤字"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_world_market]を通じて[Market.GetName]から商品を輸入している各[concept_market]を、[Concept('concept_trade','$concept_exports|q$')]量の割合順に表示します。\n二国間貿易額は現在の[concept_world_market_price]で換算されます。"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_world_market]を通じて[Market.GetName]へ商品を輸出している各[concept_market]を、[Concept('concept_trade','$concept_imports|q$')]量の割合順に表示します。\n二国間貿易額は現在の[concept_world_market_price]で換算されます。"
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "各商品は現在の[concept_world_market_price]で換算"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Scope.GetMarket.GetName]からの[Concept('concept_trade','$concept_imports|q$')]は[Market.GetName]の総[Concept('concept_trade','$concept_imports|q$')]量の #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! を占めています\n$TOOLTIP_DELIMITER$\n• 相手市場から：#v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• 市場の総[Concept('concept_trade','$concept_imports|q$')]：#v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Scope.GetMarket.GetName]への[Concept('concept_trade','$concept_exports|q$')]は[Market.GetName]の総[Concept('concept_trade','$concept_exports|q$')]量の #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! を占めています\n$TOOLTIP_DELIMITER$\n• 相手市場へ：#v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• 市場の総[Concept('concept_trade','$concept_exports|q$')]：#v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n二国間貿易総額：@money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! 相手市場への[Concept('concept_trade','$concept_exports|q$')]：@money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!（#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!）\n@market_imports! 相手市場からの[Concept('concept_trade','$concept_imports|q$')]：@money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!（#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!）"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n対[Scope.GetMarket.GetName]：@money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]額：@money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]額：@money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore 現在の[concept_world_market_price]で換算#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n二国間貿易額：@money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 取引量：#v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n二国間貿易額：@money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 取引量：#v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n対[Market.GetName]：@money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')]額：@money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')]額：@money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore 現在の[concept_world_market_price]で換算#!"
 TRADE_PARTNERS_OTHER_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n二国間貿易額：@money!#v [Multiply_CFixedPoint(Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 取引量：#v [Market.GetImportedAmountFromMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\n二国間貿易額：@money!#v [Multiply_CFixedPoint(Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• 取引量：#v [Market.GetExportedAmountToMarket(GetPlayer.GetMarket.Self, Goods.Self)|D]#!\n• [concept_world_market_price]：@money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
