l_turkish:
 # GORA UI+ — Advanced GDP Tracker: vanilla tooltip overrides
 # Adds GDP-growth, LARP fractions and per-state GDP breakdowns to vanilla
 # tooltips. Verified against vanilla 1.13.4 keys (RADICALS_TOOLTIP,
 # LOYALISTS_TOOLTIP, NEUTRALS_TOOLTIP, POP_TOOLTIP, GDP_TOOLTIP,
 # CURRENT_GDP_STATE).

 # ─── LARP-extended population & GDP tooltips ────────────────────────────
 RADICALS_TOOLTIP:1 "#tooltip_header $RADICALS$#!\n[Country.GetName] ülkesinin toplam #v [Country.GetTotalPopulation|D]#! nüfusu içerisindeki $RADICALS$: #v [Country.GetNumRadicals|D]#! ([Country.MakeScope.ScriptValue('larp_radicals_percent')|%v1])\n$TOOLTIP_DELIMITER$\n$RADICALS$ sayısı [Country.GetRadicalsLoyalistsChangeStartDate|v] tarihinden bu yana #v #tooltippable #tooltip:[Country.GetTooltipTag],RADICALS_CHANGE_TOOLTIP [Country.GetTotalNumRadicalsChange|D=-]#!#!#! değişti.\nEn etkili faktörler [Country.GetRadicalsChangeSummary]\n\n[Country.GetRadicalsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( GreaterThan_int32(Country.CalcNumStatesInTurmoil, '(int32)0'), 'STATES_IN_TURMOIL', '' ))][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromRadicals, 'RADICALS_IG_APPROVAL', '' ))]"

 LOYALISTS_TOOLTIP:1 "#tooltip_header $LOYALISTS$#!\n[Country.GetName] ülkesinin toplam #v [Country.GetTotalPopulation|D]#! nüfusu içerisindeki $LOYALISTS$: #v [Country.GetNumLoyalists|D]#! ([Country.MakeScope.ScriptValue('larp_loyalists_percent')|%v1])\n$TOOLTIP_DELIMITER$\n$LOYALISTS$ sayısı [Country.GetRadicalsLoyalistsChangeStartDate|v] tarihinden bu yana #v #tooltippable #tooltip:[Country.GetTooltipTag],LOYALISTS_CHANGE_TOOLTIP [Country.GetTotalNumLoyalistsChange|D=+]#!#!#! değişti.\nEn etkili faktörler [Country.GetLoyalistsChangeSummary]\n\n[Country.GetLoyalistsSummaryDesc][ConcatIfNeitherEmpty('\n\n',SelectLocalization( Country.HasIGApprovalFromLoyalists, 'LOYALISTS_IG_APPROVAL', '' ))]"

 NEUTRALS_TOOLTIP: "#tooltip_header $NEUTRALS$#!\n[Country.GetName] ülkesinin toplam #v [Country.GetTotalPopulation|*2]#! nüfusu içerisindeki $NEUTRALS$: #v [Country.GetNumNeutrals|*2]#! ([Country.MakeScope.ScriptValue('larp_neutrals_percent')|%v1])"

 POP_TOOLTIP:2 "#tooltip_header [Concept('concept_pop','$concept_population$')]#!\nMevcut: [Country.GetTotalPopulation|*2v] ([Country.GetPopulationRanking])\n[Country.GetPopGrowthDesc]$POP_TOOLTIP_DELAYED$\n$TOOLTIP_DELIMITER$\n[Country.GetAdjective] nüfusu, küresel nüfusun [Country.MakeScope.ScriptValue('larp_global_pop_percent')|%v1] kadarıdır\nKüresel Nüfus: [Country.MakeScope.ScriptValue('larp_global_pop')|*2v]"

 GDP_TOOLTIP:1 "#header [Country.GetAdjective] [Concept('concept_gdp', 'GSYİH')]'si#!\n@money![Country.GetGDP|Dv] (#u #tooltippable #tooltip:[Country.GetTooltipTag],COUNTRY_GDP_OWNERSHIP_TOOLTIP [Country.GetDomesticallyOwnedGDPFraction|%1b]#!#!#!) ülke içi sahip olunan $concept_gdp_short$ ([Country.GetGDPRanking])\n@money![Country.GetGDPPerCapita|2*v] [Concept('concept_gdp_per_capita', '$concept_gdp_per_capita_short$')] ([Country.GetGDPPerCapitaRanking])\n$GDPGR_growth_text$\n$TOOLTIP_DELIMITER$\n[Country.GetAdjective] $concept_gdp_short$, küresel GSYİH'nin [Country.MakeScope.ScriptValue('larp_global_gdp_percent')|%v2] kadarıdır\nKüresel GSYİH: @money![Country.MakeScope.ScriptValue('larp_global_gdp')|Dv]"

 # ─── Per-state GDP breakdown ────────────────────────────────────────────
 CURRENT_GDP_STATE:2 "#header [State.GetName] vilayetinden gelen [State.GetOwner.GetAdjectiveNoFormatting] [concept_gdp] miktarı#!\n$TOOLTIP_DELIMITER$\nMevcut yıllık GSYİH katkısı: #variable @money![State.GetGDPContribution|K]#!\n[State.GetName] kişi başı GSYİH: #variable @money![State.MakeScope.ScriptValue('get_state_gdp_per')|Dv]#!\n[State.GetName] kişi başı GSYİH farkı (ülke ortalaması): #variable @money![State.MakeScope.ScriptValue('get_country_state_relative_value')|D2+=]#!\n[State.GetName] kişi başı GSYİH farkı (küresel ortalama): #variable @money![State.MakeScope.ScriptValue('get_global_state_relative_value')|D2+=]#!\n[State.GetName] vilayetinin yaptığı katkı, [State.GetOwner.GetAdjectiveNoFormatting] $GDP_SHORT$'sinin #variable [State.GetGDPContributionPercentage|%1]#! kadarı\n\n[State.GetGDPGoodsContributionBreakdown]"
