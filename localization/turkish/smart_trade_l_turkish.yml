 ST_REC_ONE_HEADER_TT:0 "Bu malı mal transferiyle göndermek için en kârlı 3 ülke, bu panel açıldığında hesaplanır: ilk hafta fiyatlarıyla haftalık kâr, ortağın tamamen kabul ettiği en iyi miktarda. Parantez içinde: ortağın herhangi bir madde öncesi temel kabulü (ayrıntı için üzerine gelin); 0'ın altındaki ortaklar dışarıda bırakılır."
