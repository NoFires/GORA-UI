 ST_REC_HEADER:0 "(ST) Önerilen mal transferleri"
 ST_REC_HEADER_TT:0 "Şu anda önerebileceğiniz en kârlı 5 mal transferi, her ay yeniden hesaplanır: ilk hafta fiyatlarıyla tahmin edilen haftalık kâr, ortağın tamamen kabul ettiği en iyi miktarda.\nYalnızca kârlı transferler, pazarınızda en az 10 fazlası olan mallar ve savaşta olmadığınız ortaklar.\nParantez içinde: ortağın herhangi bir madde öncesi temel kabulü (ayrıntı için üzerine gelin). 0'ın altındaki ortaklar, değerleri bilindiğinde (ilk aylarından itibaren) dışarıda bırakılır."
