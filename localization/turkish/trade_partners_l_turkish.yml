 TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT: "@market_exports! [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName] pazarına toplam [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0] mal ihraç ediyor"
 TRADE_PARTNERS_MARKET_TOOLTIP_VALUES: "[MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_IMPORT')][MakeLineIf(GreaterThanOrEqualTo_CFixedPoint(GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target'), '(CFixedPoint)1'),'TRADE_PARTNERS_MARKET_TOOLTIP_EXPORT')]"
 TRADE_PARTNERS_OTHER_MARKET_EXPORTS_TOOLTIP: "#white #b @market_exports! [Market.GetName] Pazarı, [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName] Pazarına İhracat Yapıyor\n#!#!Miktar: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_OTHER_MARKET_IMPORTS_TOOLTIP: "#white #b @market_imports! [Market.GetName] Pazarı, [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetName] Pazarından İthalat Yapıyor\n#!#!Miktar: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', GetPlayer.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_IMPORT_PARTNERS_TITLE: "#white #b @market_imports! [Market.GetName] Pazarı, [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName] Pazarından İthalat Yapıyor\n#!#!Miktar: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_imports_from_target')|v0]"
 TRADE_PARTNERS_EXPORT_PARTNERS_TITLE: "#white #b @market_exports! [Market.GetName] Pazarı, [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetName] Pazarına İhracat Yapıyor\n#!#!Miktar: [GuiScope.SetRoot(Market.MakeScope).AddScope('base_market', Scope.GetMarket.MakeScope).ScriptValue('trade_partners_total_exports_to_target')|v0]"
 TRADE_PARTNERS_EXPORTED_GOODS_TITLE: "İhraç edilen mallar:"
 TRADE_PARTNERS_IMPORTED_GOODS_TITLE: "İthal edilen mallar:"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TITLE: "İhracat Ortakları"
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TITLE: "İthalat Ortakları"
 TRADE_PARTNERS_TRADE_SURPLUS: "Ticaret Fazlası"
 TRADE_PARTNERS_TRADE_DEFICIT: "Ticaret Açığı"
 TRADE_PARTNERS_EXPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_world_market] üzerinden [Market.GetName] pazarından mal ithal eden [concept_market]lar, [Concept('concept_trade','$concept_exports|q$')] payına göre sıralanır.\nİkili değerler güncel [concept_world_market_price] üzerinden hesaplanır."
 TRADE_PARTNERS_IMPORT_PARTNERS_GRAPH_TOOLTIP: "[concept_world_market] üzerinden [Market.GetName] pazarına mal ihraç eden [concept_market]lar, [Concept('concept_trade','$concept_imports|q$')] payına göre sıralanır.\nİkili değerler güncel [concept_world_market_price] üzerinden hesaplanır."
 TRADE_PARTNERS_VALUE_FORMULA_NOTE: "Güncel [concept_world_market_price] üzerinden"
 TRADE_PARTNERS_IMPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ◀ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Scope.GetMarket.GetName] kaynaklı [Concept('concept_trade','$concept_imports|q$')], [Market.GetName] toplamının #blue_value [Divide_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalImportedAmount, '(CFixedPoint)1'))|%1]#! kadarıdır\n$TOOLTIP_DELIMITER$\n• Bu pazardan: #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!\n• Pazar toplam [Concept('concept_trade','$concept_imports|q$')]: #v [Market.GetTotalImportedAmount|D]#!"
 TRADE_PARTNERS_EXPORT_SHARE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] ▶ [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\n[Scope.GetMarket.GetName] yönlü [Concept('concept_trade','$concept_exports|q$')], [Market.GetName] toplamının #gold_value [Divide_CFixedPoint(TradePartnersGetExportsTo(Market, Scope.GetMarket), Max_CFixedPoint(Market.GetTotalExportedAmount, '(CFixedPoint)1'))|%1]#! kadarıdır\n$TOOLTIP_DELIMITER$\n• Bu pazara: #v [TradePartnersGetExportsTo(Market, Scope.GetMarket)|0D]#!\n• Pazar toplam [Concept('concept_trade','$concept_exports|q$')]: #v [Market.GetTotalExportedAmount|D]#!"
 TRADE_PARTNERS_BAR_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Scope.GetMarket.GetOwner.GetFlagTextIcon] [Scope.GetMarket.GetNameNoFormatting]#!\nToplam İkili Ticaret: @money!#v [Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|D]#!\n$TOOLTIP_DELIMITER$\n@market_exports! Ortağa [Concept('concept_trade','$concept_exports|q$')]: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#! (#gold_value [Divide_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)\n@market_imports! Ortaktan [Concept('concept_trade','$concept_imports|q$')]: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#! (#blue_value [Divide_CFixedPoint(TradePartnersGetImportValueFrom(Market, Scope.GetMarket), Max_CFixedPoint(Add_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket)), '(CFixedPoint)1'))|%1]#!)"
 TRADE_PARTNERS_BALANCE_BREAKDOWN: "#header [Market.GetOwner.GetFlagTextIcon] [Market.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n[Scope.GetMarket.GetName] ile: @money![Subtract_CFixedPoint(TradePartnersGetExportValueTo(Market, Scope.GetMarket), TradePartnersGetImportValueFrom(Market, Scope.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] Değeri: @money!#v [TradePartnersGetExportValueTo(Market, Scope.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] Değeri: @money!#v [TradePartnersGetImportValueFrom(Market, Scope.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Güncel [concept_world_market_price] üzerinden#!"
 TRADE_PARTNERS_GOODS_IMPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nİkili Değer: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Ticaret Hacmi: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_GOODS_EXPORT_VALUE_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting] · [Localize('MARKET_TRADED_AMOUNT')]#!\nİkili Değer: @money!#v [Multiply_CFixedPoint(Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self), Goods.GetWorldMarketBasePrice)|D]#!\n$TOOLTIP_DELIMITER$\n• Ticaret Hacmi: #v [Scope.GetMarket.GetImportedAmountFromMarket(Market.Self, Goods.Self)|D]#!\n• [concept_world_market_price]: @money!#v [Goods.GetWorldMarketBasePrice|1]#!\n$TOOLTIP_DELIMITER$\n[Goods.GetWorldMarketBasePriceDesc]"
 TRADE_PARTNERS_OTHER_BALANCE_BREAKDOWN: "#header [GetPlayer.GetMarket.GetOwner.GetFlagTextIcon] [GetPlayer.GetMarket.GetNameNoFormatting] · [Localize('TRADE_DEFICIT_SURPLUS')]#!\n[Market.GetName] ile: @money![Subtract_CFixedPoint(TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket), TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket))|=+D]\n$TOOLTIP_DELIMITER$\n@market_exports! [Concept('concept_trade','$concept_exports|q$')] Değeri: @money!#v [TradePartnersGetImportValueFrom(Market, GetPlayer.GetMarket)|D]#!\n@market_imports! [Concept('concept_trade','$concept_imports|q$')] Değeri: @money!#v [TradePartnersGetExportValueTo(Market, GetPlayer.GetMarket)|D]#!\n$TOOLTIP_DELIMITER$\n#lore Güncel [concept_world_market_price] üzerinden#!"
