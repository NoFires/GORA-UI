 TRADE_PARTNERS_GOODS_IMPORT_AMOUNT_BREAKDOWN: "#header [Goods.GetTextIcon] [Goods.GetNameNoFormatting]#!\n[Scope.GetMarket.GetName] pazarından [Concept('concept_trade','$concept_imports|q$')]: #v [Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self)|D]#!\n$TOOLTIP_DELIMITER$\n• Bu pazardan yapılan [Concept('concept_trade','$concept_imports|q$')] içindeki payı: #blue_value [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(TradePartnersGetImportsFrom(Market, Scope.GetMarket), '(CFixedPoint)1'))|%1]#! (toplam #v [TradePartnersGetImportsFrom(Market, Scope.GetMarket)|0D]#!)\n• Ortağın [Goods.GetNameNoFormatting] ihracatındaki payı: #v [Divide_CFixedPoint(Scope.GetMarket.GetExportedAmountToMarket(Market.Self, Goods.Self), Max_CFixedPoint(Goods.GetMarketExports, '(CFixedPoint)1'))|%1]#! (toplam #v [Goods.GetMarketExports|D]#!)"
