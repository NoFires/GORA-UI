 com_topbar_element_charters_tooltip: "#header [Concept('concept_company_charter','$concept_company_charters$')]#!\nKullanılan ücretsiz [Concept('concept_company_charter','$concept_company_charters$')]: [GetPlayer.GetUsedFreeCharters|v] / [GetPlayer.GetModifier.GetValueWithBreakdownFor('country_free_charters_add')]"
