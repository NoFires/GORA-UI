 GORA_SUPPLY_DEFICIT_TOOLTIP:0     "#header Arz Açığı#!\nAlım emirlerinin (tüketim) satış emirlerini (üretim) aştığı mallar.\nBu mallar pazarınızda pahalılaşma eğilimindedir.\nAçık, ithalat yoluyla kapatılır."
 GORA_BALANCE_NET_TOOLTIP:0        "#header Pazar Dengesi#!\nTüm mallar genelindeki arz-talep dengesi.\nPozitif = genel arz fazlası (fiyatlar düşme eğiliminde)\nNegatif = genel talep fazlası (fiyatlar yükselme eğiliminde)"

